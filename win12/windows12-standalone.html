          gl.appendChild(row('🎮', 'Геймпады не найдены', 'Подключите контроллер и нажмите любую кнопку — он появится здесь', el('span')));
        } else pads.forEach(p => gl.appendChild(row('🎮', p.id.slice(0, 42),
          'кнопок: ' + p.buttons.length + ' · осей: ' + p.axes.length,
          el('div', 'muted tiny', 'подключён'))));
      };
      drawPads();
      addEventListener('gamepadconnected', drawPads, { once:true });
      main.appendChild(g);

      const bt = card('Bluetooth');
      const b = Real.bluetooth();
      if (b.api){
        const pick = el('button', 'btn pri', 'Выбрать устройство');
        const res = el('div', 'muted tiny', '');
        pick.onclick = async () => { res.textContent = 'открываю системный диалог…';
          const r = await Real.btPick();
          res.textContent = r.error ? r.error : 'выбрано: ' + r.name; };
        const rr = row('🎧', 'Подключить по Bluetooth', 'Откроется настоящий системный список устройств', pick);
        rr.querySelector('.ctl').appendChild(res);
        bt.appendChild(rr);
      } else {
        bt.appendChild(row('🚫', 'Web Bluetooth недоступен',
          b.secure ? 'Браузер не поддерживает этот API' : 'Нужен защищённый контекст (https)', el('span')));
      }
      main.appendChild(bt);

      const md = card('Камеры, микрофоны и динамики');
      const mdl = el('div'); md.appendChild(mdl);
      Real.media().then(list => {
        mdl.innerHTML = '';
        const groups = [['📷','Камеры','videoinput'],['🎙','Микрофоны','audioinput'],['🔈','Динамики','audiooutput']];
        groups.forEach(([e, n, kind]) => {
          const arr = list.filter(x => x.kind === kind);
          mdl.appendChild(row(e, n, arr.length ? 'названия видны после выдачи доступа' : 'не обнаружены',
            el('div', 'muted tiny', arr.length ? arr.length + ' шт.' : '0')));
        });
      });
      main.appendChild(md);

      const p = card('Питание');
      const pl = el('div'); p.appendChild(pl);
      Real.battery().then(b2 => {
        pl.innerHTML = '';
        if (!b2){ pl.appendChild(row('🔋', 'Battery API недоступен', 'Этот браузер не сообщает состояние батареи', el('span'))); return; }
        pl.appendChild(row(b2.charging ? '🔌' : '🔋', 'Заряд батареи',
          b2.charging ? 'Заряжается' : 'От батареи', el('div', 'muted tiny', b2.level + '%')));
        const left = b2.charging ? b2.timeFull : b2.timeLeft;
        if (isFinite(left) && left > 0)
          pl.appendChild(row('⏳', b2.charging ? 'До полной зарядки' : 'Осталось работы', '',
            el('div', 'muted tiny', Math.floor(left / 3600) + ' ч ' + Math.round(left % 3600 / 60) + ' мин')));
      });
      main.appendChild(p);

      const h = card('Оборудование');
      [['⚙️','Логических ядер', sy.cores || 'н/д'],
       ['🧠','Оперативная память', sy.mem ? sy.mem + ' ГБ (округлено браузером)' : 'н/д'],
       ['💻','Платформа', sy.platform],
       ['📱','Мобильное устройство', sy.mobile ? 'да' : 'нет']
      ].forEach(([e, k, v]) => h.appendChild(row(e, k, '', el('div', 'muted tiny', String(v)))));
      main.appendChild(h);
    }

    /* --- Уведомления --- */
    function pNotif(){
      const c = card('Уведомления');
      c.appendChild(row('🔔', 'Уведомления', 'Показывать баннеры приложений', toggle(() => KV.get('notif', true), v => KV.set('notif', v))));
      c.appendChild(row('🌙', 'Не беспокоить', 'Скрывать баннеры и звуки', toggle(() => S.dnd, v => { set('dnd', v); Shell.updateCC(); })));
      const fs = el('div', 'row');
      const fsel = sel([{ n:'25 минут', v:'25' }, { n:'50 минут', v:'50' }, { n:'90 минут', v:'90' }],
        () => KV.get('focusLen', '25'), v => KV.set('focusLen', v));
      const fbtn = el('button', 'btn pri', 'Начать');
      const fout = el('div', 'muted tiny', '');
      let fiv = null;
      const stopFocus = () => { clearInterval(fiv); fiv = null; fbtn.textContent = 'Начать';
        fout.textContent = ''; Store.set('dnd', false); Shell.updateCC(); };
      fbtn.onclick = () => {
        if (fiv) return stopFocus();
        let left = +fsel.value * 60;
        Store.set('dnd', true); Shell.updateCC();
        fbtn.textContent = 'Прервать';
        fiv = setInterval(() => {

          fout.textContent = Math.floor(left / 60) + ':' + pad2(left % 60);
        }, 1000);
        Shell.toast('Фокусировка', 'Уведомления выключены на ' + fsel.value + ' мин', '🎯');
      };
      fs.append(fsel, fbtn, fout);
      c.appendChild(row('🎯', 'Фокусировка', 'Реально включает «Не беспокоить» на заданное время', fs));
      const t = el('button', 'btn', 'Показать'); t.onclick = () => Shell.toast('Тестовое уведомление', 'Так выглядят баннеры Windows 12', '🔔');
      c.appendChild(row('🧪', 'Проверить', 'Показать пример уведомления', t));
      main.appendChild(c);

    /* --- Приложения --- */
    function pApps(){
      const c = card('Установленные приложения');

        const b = el('button', 'btn', 'Открыть'); b.onclick = () => WM.open(id);
        c.appendChild(row(a.glyph, a.name, 'Системное приложение · ' + (a.w || 800) + '×' + (a.h || 600), b));
      });

    /* --- Доступность --- */
    function pA11y(){
      const c = card('Зрение');
      c.appendChild(row('🔍', 'Масштаб текста', '',
        seg([{ n:'S', v:.9 }, { n:'M', v:1 }, { n:'L', v:1.15 }, { n:'XL', v:1.3 }],

      c.appendChild(row('🖱', 'Крупный курсор', '', toggle(() => KV.get('bigCursor', false), v => { KV.set('bigCursor', v);

      main.appendChild(c);

    /* --- Приватность --- */
    function pPrivacy(){
      const c = card('Разрешения браузера');
      const box = el('div'); c.appendChild(box);
      const items = [
        ['📷','Камера','camera', () => Real.askCamera()],
        ['🎤','Микрофон','microphone', () => Real.askMic()],
        ['📍','Геолокация','geolocation', () => Real.askGeo().then(Boolean)],
        ['🔔','Уведомления','notifications', () => Notification.requestPermission().then(r => r === 'granted')]
      ];
      const RU = { granted:'разрешено', denied:'запрещено', prompt:'спросит при обращении', unknown:'неизвестно' };
      const draw = () => {
        box.innerHTML = '';
        items.forEach(([e, n, perm, ask]) => {
          const st = el('div', 'muted tiny', '…');
          const b = el('button', 'btn', 'Запросить');
          b.onclick = () => ask().then(() => setTimeout(draw, 300));
          const r = row(e, n, 'Настоящее разрешение этой страницы', b);
          r.querySelector('.ctl').insertBefore(st, b);
          box.appendChild(r);
          Real.perm(perm).then(v => {
            st.textContent = RU[v] || v;
            if (v === 'granted' || v === 'denied') b.style.display = 'none';
          });
        });
      };
      draw();
      main.appendChild(c);

      const d = card('Данные прототипа');
      d.appendChild(row('🔒', 'Всё хранится только у вас', 'Настройки и файлы лежат в localStorage и IndexedDB этого браузера. Ни один байт никуда не отправляется — сетевые запросы делает только погода и проверка соединения, по вашему действию.', el('span')));
      const stEl = el('div', 'muted tiny', 'считаю…');
      d.appendChild(row('💾', 'Занято хранилища', 'Оценка браузера по всем данным сайта', stEl));
      Real.storage().then(x => {
        stEl.textContent = x.usage != null
          ? (x.usage / 1048576).toFixed(1) + ' МБ из ' + (x.quota / 1048576).toFixed(0) + ' МБ'
          : (x.ls / 1024).toFixed(1) + ' КБ (localStorage)';
      });
      const wipe = el('button', 'btn', 'Стереть всё');
      wipe.onclick = async () => {
        if (!confirm('Удалить все настройки, файлы и загруженное аудио?')) return;
        localStorage.clear();
        try { indexedDB.deleteDatabase('win12'); } catch(e){}
        location.reload();
      };
      d.appendChild(row('🧹', 'Полная очистка', 'Вернуть систему в исходное состояние', wipe));
      main.appendChild(d);

      const s2 = card('Что прототип не умеет');
      s2.appendChild(row('🛡', 'Антивирус, брандмауэр, шифрование диска',
        'Веб-страница не имеет доступа к этим механизмам вашей ОС, поэтому таких разделов здесь нет — вместо имитации показываем только то, что действительно работает.', el('span')));
      main.appendChild(s2);
    }

    /* --- Сборка --- */
    function pUpdate(){
      const c = card('Сборка');
      c.appendChild(row('📦', 'Windows 12 Prototype', 'Версия 12.0 (сборка 1200)', el('div', 'muted tiny', 'локальная')));
      c.appendChild(row('🔄', 'Автоматических обновлений нет',
        'Это страница, которая целиком лежит у вас: обновление — это новая версия файла. Кнопки «Проверить обновления» здесь не будет, потому что проверять нечего.', el('span')));
      const rl = el('button', 'btn', 'Перезагрузить');
      rl.onclick = () => location.reload();
      c.appendChild(row('♻️', 'Перезапустить систему', 'Перечитает файлы с диска', rl));
      main.appendChild(c);

      const st = card('Хранилище и сохранность');
      const info = el('div', 'muted tiny', 'считаю…');
      st.appendChild(row('💾', 'Занято', 'localStorage + IndexedDB', info));
      const pb = el('button', 'btn', 'Закрепить');
      const pst = el('div', 'muted tiny', '');
      pb.onclick = () => Real.persist().then(ok => {
        pst.textContent = ok ? 'закреплено' : 'браузер отказал';
        Shell.toast('Хранилище', ok ? 'Данные защищены от автоочистки' : 'Браузер не дал закрепить', ok ? '🔒' : '⚠️');
      });
      const pr = row('🔒', 'Защитить от автоочистки', 'Браузер может удалять данные сайтов при нехватке места', pb);
      pr.querySelector('.ctl').insertBefore(pst, pb);
      st.appendChild(pr);
      Real.storage().then(x => {
        info.textContent = x.usage != null
          ? (x.usage / 1048576).toFixed(1) + ' МБ из ' + (x.quota / 1048576).toFixed(0) + ' МБ'
          : (x.ls / 1024).toFixed(1) + ' КБ';
        if (x.persisted) pst.textContent = 'уже закреплено';
      });
      main.appendChild(st);

      const h = card('История версий');
      [['12.0.1200','Честные разделы: реальные сеть, устройства, разрешения и погода'],
       ['12.0.1190','Панель задач Windows, виджеты, свои аудиофайлы, тёмная тема'],
       ['12.0.1180','Проводник, корзина, мост с настоящей ОС'],
       ['12.0.1150','Первая сборка оболочки']
      ].forEach(([v, d]) => h.appendChild(row('📦', 'Сборка ' + v, d, el('div', 'muted tiny', 'установлена'))));
      main.appendChild(h);
    }

    /* --- О системе --- */
    function pAbout(){
      const box = el('div', 'card');
      box.innerHTML = `<div class="about-logo">
        <div class="win-logo"><i></i><i></i><i></i><i></i></div>
        <h2 style="margin:0">Windows 12 Pro</h2>
        <div class="muted">Версия 12.0 (сборка 1200) · Прототип</div></div>`;
      main.appendChild(box);
      const c = card('Характеристики устройства');
      [['💻','Имя устройства','DYMENSITY-PC'],
       ['⚙️','Процессор', (navigator.hardwareConcurrency || 8) + ' логических ядер'],
       ['🧠','Память', (navigator.deviceMemory ? navigator.deviceMemory + ' ГБ' : 'н/д')],
       ['🖥️','Экран', screen.width + ' × ' + screen.height + ' @ ' + (devicePixelRatio || 1) + 'x'],
       ['🌐','Движок', navigator.userAgent.includes('Firefox') ? 'Gecko' : navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome') ? 'WebKit' : 'Blink'],
       ['🗣','Язык', navigator.language]
      ].forEach(([e, n, v]) => c.appendChild(row(e, n, '', el('div', 'muted tiny', v))));
      main.appendChild(c);
      const r = card('Сброс');
      const b = el('button', 'btn', 'Сбросить настройки');
      b.onclick = () => { if (confirm('Вернуть настройки по умолчанию?')){ Store.reset(); Shell.renderShell(); drawMain(); Shell.toast('Готово', 'Настройки сброшены', '🔄'); } };
      r.appendChild(row('♻️', 'Настройки по умолчанию', 'Файлы останутся на месте', b));

    drawNav(); drawMain();
  }
};

APPS.settings.onReopen = function(win, opts){
  if (!opts || !opts.section) return;

</script>
<script>
/* ==========================================================================
   Оболочка: док, Пуск, центр управления, виджеты, поиск, Task View,
   уведомления, контекстные меню, экран блокировки
   ========================================================================== */
'use strict';

const Shell = {
  nowPlaying:null,
  wallTimer:null,

  init(){
    this.renderShell();
    this.bindTray();
    this.bindStart();
    this.bindSpot();
    this.bindDesktop();
    this.bindKeys();
    this.bindGlassPointer();
    this.clock();
    setInterval(() => this.clock(), 1000);
    this.wallShuffle();
    this.autoTheme();
    this.hotCorners();
    this.dockMagnify();
  },

  renderShell(){
    this.renderDock();
    this.renderStart();
    this.renderIcons();
    this.renderDeskWidgets();
    this.renderCC();
    this.renderWidgets();
    this.renderTaskview();
    $('#tbw-city').textContent = S.city;
  },

  /* ================= ДОК ================= */
  renderDock(){
    const box = $('#dock-items');
    box.innerHTML = '';
    S.dockApps.filter(id => APPS[id]).forEach(id => {
      const a = APPS[id];
      const b = el('button', 'dock-item');
      b.dataset.app = id;
      b.dataset.tip = a.name;
      b.appendChild(appIcon(a));
      b.onclick = () => this.launch(id, b);
      b.oncontextmenu = e => {
        e.preventDefault();
        const open = WM.wins.filter(w => w.appId === id);
        this.ctx(e.clientX, e.clientY, [
          { i:a.glyph, t:'Открыть', f:() => this.launch(id) },
          ...(open.length ? [{ i:'✖', t:'Закрыть все окна', f:() => open.forEach(w => WM.close(w)) }] : []),
          'hr',
          { i:'📌', t:'Убрать из дока', f:() => { S.dockApps = S.dockApps.filter(x => x !== id); Store.save(); this.renderDock(); } }
        ]);
      };
      box.appendChild(b);
    });
    this.syncDock();
    this.dockMagnify();
  },

  syncDock(){
    const running = {};
    WM.wins.forEach(w => { running[w.appId] = running[w.appId] || []; running[w.appId].push(w); });
    const active = WM.wins.find(w => w.node.classList.contains('focus') && !w.minimized);

    $$('#dock-items .dock-item').forEach(b => {
      const id = b.dataset.app;
      b.classList.toggle('run', !!running[id]);
      b.classList.toggle('active', !!(active && active.appId === id));
    });

    // запущенные, но не закреплённые
    const box = $('#dock-running');
    const extra = Object.keys(running).filter(id => !S.dockApps.includes(id));
    $('#dock-sep-run').hidden = !extra.length;
    box.innerHTML = '';
    extra.forEach(id => {
      const a = APPS[id];
      if (!a) return;                       // приложение удалено, окна ещё закрываются
      const b = el('button', 'dock-item run' + (active && active.appId === id ? ' active' : ''));
      b.dataset.app = id; b.dataset.tip = a.name;
      b.appendChild(appIcon(a));
      b.onclick = () => this.launch(id, b);
      box.appendChild(b);
    });
    this.dockMagnify();
    this.renderTaskview();
  },

  launch(id, btn){
    const wins = WM.wins.filter(w => w.appId === id && w.desk === WM.desk);
    if (!wins.length){
      if (btn) { btn.classList.add('bounce'); setTimeout(() => btn.classList.remove('bounce'), 700); }
      WM.open(id);
    } else {
      const focused = wins.find(w => w.node.classList.contains('focus') && !w.minimized);
      if (focused && wins.length === 1) WM.minimize(focused);
      else { const t = wins.find(w => w.minimized) || wins[0]; if (t.minimized) WM.restore(t); else WM.focus(t); }
    }
    this.closePanels();
  },

  dockIconRect(appId){
    const b = $(`#dock .dock-item[data-app="${appId}"]`);
    return b ? b.getBoundingClientRect() : null;

  /* увеличение значков как в macOS */
  dockMagnify(){
    const dock = $('#dock');
    if (dock._mag) return;
    dock._mag = true;
    const items = () => $$('.dock-item', dock);
    dock.addEventListener('mousemove', e => {
      if (!S.dockMagOn) return;
      items().forEach(it => {
        const r = it.getBoundingClientRect();
        const d = Math.abs(e.clientX - (r.left + r.width / 2));
        const f = Math.max(0, 1 - d / 150);
        const s = 1 + (S.dockMag - 1) * Math.pow(f, 2.2);
        it.style.transform = `scale(${s}) translateY(${-(s - 1) * 14}px)`;
      });
    });
    dock.addEventListener('mouseleave', () => items().forEach(it => it.style.transform = ''));
  },

  toggleStart(v){
    const on = v != null ? v : !document.body.classList.contains('start-open');
    this.closePanels(true);
    document.body.classList.toggle('start-open', on);
    if (on){
      $('#start-input').value = ''; this.startSearch('');

      Snd.blip(880, .06, 'sine', .03);
    }

  startSearch(q){
    const res = $('#start-results'), body = $('#start-body');
    q = q.trim().toLowerCase();
    if (!q){ res.hidden = true; body.hidden = false; return; }
    res.hidden = false; body.hidden = true;
    res.innerHTML = '';
    const items = this.searchAll(q);
    if (!items.length){ res.appendChild(el('div', 'empty', 'Ничего не найдено')); return; }
    items.forEach(it => res.appendChild(this.resNode(it)));
  },

  searchAll(q){
    const out = [];
    Object.entries(APPS).forEach(([id, a]) => {
      if (a.name.toLowerCase().includes(q) || id.includes(q))
        out.push({ ico:a, t:a.name, s:'Приложение', k:'Enter', run:() => WM.open(id) });
    });
    const walk = (node, path) => {
      Object.values(node.children || {}).forEach(c => {
        if (c.name.toLowerCase().includes(q))
          out.push({ emo:c.type === 'dir' ? '📁' : '📄', t:c.name, s:'/' + path.join('/'), k:'Файл',
            run:() => c.type === 'dir' ? WM.open('files', { path:[...path, c.name] })
                                       : WM.open('notepad', { file:{ name:c.name, path:path.slice(), body:c.body } }) });
        if (c.type === 'dir') walk(c, [...path, c.name]);
      });
    };
    walk(FS.root, []);
    [['Обои','person'],['Цвет акцента','person'],['Тема','person'],['Liquid Glass','person'],['Размытие','person'],
     ['Анимации','motion'],['Звук','sound'],['Яркость','display'],['Wi-Fi','net'],['Bluetooth','bt'],
     ['Уведомления','notif'],['Обновления','update'],['О системе','about'],['Док','dock']]
      .forEach(([n, sec]) => { if (n.toLowerCase().includes(q))
        out.push({ emo:'⚙️', t:n, s:'Параметры', k:'Параметр', run:() => WM.open('settings', { section:sec }) }); });

    if (/^[\d\s+\-*/.,()]+$/.test(q) && /[\d]/.test(q)){
      try { const v = Function('"use strict";return (' + q.replace(/,/g, '.') + ')')();
        if (typeof v === 'number' && isFinite(v)) out.unshift({ emo:'🧮', t:String(+v.toFixed(8)), s:q + ' =', k:'Калькулятор', run:() => WM.open('calc') });
      } catch(e){}
    }
    return out.slice(0, 12);
  },

  resNode(it){
    const n = el('div', 'sres');
    if (it.ico) n.appendChild(appIcon(it.ico));
    else { const d = el('div', 'app-ico', it.emo); d.style.background = 'rgba(255,255,255,.16)'; n.appendChild(d); }
    n.appendChild(el('div', 't', `${esc(it.t)}<small>${esc(it.s)}</small>`));
    n.appendChild(el('div', 'k', it.k || ''));
    n.onclick = () => { it.run(); this.closePanels(); };
    return n;
  },

  /* ================= SPOTLIGHT ================= */
  bindSpot(){
    const ov = $('#spot-overlay'), inp = $('#spot-input'), res = $('#spot-res');
    $('#tb-search').onclick = () => this.spot(true);
    ov.onclick = e => { if (e.target === ov) this.spot(false); };
    inp.addEventListener('input', () => {
      const q = inp.value.trim().toLowerCase();
      res.innerHTML = '';
      if (!q) return;
      const items = this.searchAll(q);
      if (!items.length){ res.appendChild(el('div', 'empty', 'Ничего не найдено')); return; }
      items.forEach((it, i) => { const n = this.resNode(it); if (!i) n.classList.add('on'); res.appendChild(n); });
    });
    inp.addEventListener('keydown', e => {
      const list = $$('.sres', res);
      let i = list.findIndex(n => n.classList.contains('on'));
      if (e.key === 'ArrowDown'){ e.preventDefault(); i = Math.min(list.length - 1, i + 1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); i = Math.max(0, i - 1); }
      else if (e.key === 'Enter'){ if (list[i]) list[i].click(); return; }
      else if (e.key === 'Escape'){ this.spot(false); return; }
      else return;
      list.forEach(n => n.classList.remove('on'));
      if (list[i]) list[i].classList.add('on');
    });
  },
  spot(on){
    this.closePanels(true);
    $('#spot-overlay').classList.toggle('on', on);
    if (on){ $('#spot-input').value = ''; $('#spot-res').innerHTML = ''; setTimeout(() => $('#spot-input').focus(), 120); }

  /* ================= КОНТЕКСТНОЕ МЕНЮ ================= */
  ctx(x, y, items){
    const c = $('#ctx');
    c.innerHTML = '';
    items.forEach(it => {
      if (it === 'hr'){ c.appendChild(el('hr')); return; }
      const b = el('button', '', `<span class="em">${it.i || ''}</span><span>${it.t}</span>${it.k ? `<span class="k">${it.k}</span>` : ''}`);
      b.onclick = () => { c.classList.remove('on'); it.f && it.f(); };
      c.appendChild(b);
    });
    c.classList.add('on');
    const r = c.getBoundingClientRect();
    c.style.left = Math.min(x, innerWidth - r.width - 10) + 'px';
    c.style.top = Math.min(y, innerHeight - r.height - 10) + 'px';
  },

  bindDesktop(){
    const d = $('#desktop');
    d.addEventListener('click', e => {
      if (!e.target.closest('.win, .dock, .start, #cc, #widgets, .topbar, .ctx')) this.closePanels();
      if (!e.target.closest('.di')) $$('.di').forEach(x => x.classList.remove('sel'));
    });
    d.addEventListener('contextmenu', e => {
      if (e.target.closest('.win, .dock, .start, .di, #cc, #widgets')) return;
      e.preventDefault();
      this.ctx(e.clientX, e.clientY, [
        { i:'🔄', t:'Обновить', f:() => this.renderShell() },
        { i:'📄', t:'Создать текстовый файл', f:() => { const n = prompt('Имя файла', 'Новый.txt'); if (n){ FS.write(['Рабочий стол'], n, ''); this.renderIcons(); } } },
        { i:'📁', t:'Создать папку', f:() => { const n = prompt('Имя папки', 'Новая папка'); if (n){ FS.mkdir(['Рабочий стол'], n); this.renderIcons(); } } },
        'hr',
        { i:'▦', t:'Разложить окна', f:() => WM.tile(), k:'' },
        { i:'🗂', t:'Каскад окон', f:() => WM.cascade() },
        { i:'🪟', t:'Просмотр задач', f:() => this.taskview(true), k:'Win+Tab' },
        'hr',
        { i:'🖼️', t:'Сменить обои', f:() => WM.open('settings', { section:'person' }) },
        { i:'⚙️', t:'Параметры', f:() => WM.open('settings') }
      ]);
    });
    // автоскрытие дока
    addEventListener('mousemove', e => {
      if (!S.dockAutohide) return;
      const near = e.clientY > innerHeight - 60;
      document.body.classList.toggle('dock-peek', near);
      document.body.classList.toggle('dock-hidden', !near);
    });
  },

  hotCorners(){
    let fired = false;
    addEventListener('mousemove', e => {
      if (!S.hotcorners) return;
      const corner = e.clientX > innerWidth - 6 && e.clientY < 6;
      if (corner && !fired){ fired = true; this.taskview(true); }
      if (!corner) fired = false;
    });
  },

  /* ================= УВЕДОМЛЕНИЯ ================= */
  toast(title, text, icon = '🔔', ms = 4200){
    if (S.dnd) return;
    const t = el('div', 'toast');
    t.innerHTML = `<div class="app-ico" style="background:linear-gradient(140deg,var(--accent),var(--accent-2))">${icon}</div>
      <div class="tx"><b>${esc(title)}</b>${esc(text)}</div>`;
    t.onclick = () => close();
    $('#toasts').appendChild(t);
    Snd.note();
    const close = () => { t.classList.add('out'); setTimeout(() => t.remove(), 320); };
    setTimeout(close, ms);
  },

  /* ================= ЧАСЫ / ФОН / ТЕМА ================= */
  clock(){
    const n = new Date();
    let h = n.getHours();
    const suf = S.clock24 ? '' : (h >= 12 ? ' PM' : ' AM');
    if (!S.clock24) h = h % 12 || 12;
    const time = `${S.clock24 ? pad2(h) : h}:${pad2(n.getMinutes())}${S.showSeconds ? ':' + pad2(n.getSeconds()) : ''}${suf}`;
    const date = n.toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
    const tt = $('#tray-time'), td = $('#tray-date');
    if (tt) tt.textContent = time;
    if (td) td.textContent = date;
    const lt = $('#lock-time'), ld = $('#lock-date');
    if (lt) lt.textContent = `${S.clock24 ? pad2(h) : h}:${pad2(n.getMinutes())}${suf}`;
    if (ld) ld.textContent = n.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
    const dw = $('#dw-clock'); if (dw) dw.textContent = `${pad2(n.getHours())}:${pad2(n.getMinutes())}`;
    const lw = $('#lock-weather');
    if (lw){ const w = this.weather(); lw.innerHTML = `${w.ico} ${w.t > 0 ? '+' : ''}${w.t}° · ${w.desc} · ${esc(S.city)}`; }
    const tb = $('#tbw-temp'); if (tb){ const w = this.weather(); tb.textContent = (w.t > 0 ? '+' : '') + w.t + '°'; $('#tb-weather .tbw-icon').textContent = w.ico; }
  },

  wallShuffle(){
    clearInterval(this.wallTimer);
    if (!S.wallShuffle) return;
    this.wallTimer = setInterval(() => {
      const i = WALLPAPERS.findIndex(w => w.id === S.wallpaper);
      const next = WALLPAPERS[(i + 1) % WALLPAPERS.length];
      const nx = $('#wallpaper-next');
      nx.style.backgroundImage = next.css;
      nx.style.opacity = '1';
      setTimeout(() => { Store.set('wallpaper', next.id); nx.style.opacity = '0'; }, 700);
    }, 30000);
  },

  autoTheme(){
    clearInterval(this._themeIv);
    if (!S.autoTheme) return;
    const upd = () => { const h = new Date().getHours();
      Store.set('theme', (h >= 8 && h < 20) ? 'light' : KV.get('darkVariant', 'glass')); };
    upd(); this._themeIv = setInterval(upd, 60000);
  },

  /* блик стекла следует за курсором */
  bindGlassPointer(){
    addEventListener('mousemove', e => {
      const t = e.target.closest('.lg');
      if (!t) return;
      const r = t.getBoundingClientRect();
      t.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
      t.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
    }, { passive:true });
  },

  /* ================= КЛАВИАТУРА ================= */
  bindKeys(){
    addEventListener('keydown', e => {
      const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);

      if (e.key === 'Meta' && !e.repeat && !typing){ e.preventDefault(); this.toggleStart(); return; }
      if (e.metaKey || e.ctrlKey){
        if (e.key === ' '){ e.preventDefault(); this.spot(true); return; }
        if (e.key.toLowerCase() === 'w' && !typing){ const t = WM.top(); if (t){ e.preventDefault(); WM.close(t); } return; }
        if (e.key === 'Tab' && e.metaKey){ e.preventDefault(); this.taskview(); return; }
        if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
          e.preventDefault();
          WM.gotoDesk(clamp(WM.desk + (e.key === 'ArrowRight' ? 1 : -1), 0, WM.desks - 1));
          return;
        }
        if (e.key.toLowerCase() === 'd' && !typing){ e.preventDefault(); WM.minimizeAll(); return; }
        const t = WM.top();
        if (t && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key) && e.metaKey){
          e.preventDefault();
          if (e.key === 'ArrowUp') WM.snap(t, 'max');
          else if (e.key === 'ArrowDown'){ if (t.maximized) WM.toggleMax(t); else WM.minimize(t); }
          else WM.snap(t, e.key === 'ArrowLeft' ? 'left' : 'right');
          return;
        }
      }
      if (e.key === 'Escape'){
        if ($('#taskview').classList.contains('on')) { this.taskview(false); return; }
        if ($('#power-overlay').classList.contains('on')) { $('#power-overlay').classList.remove('on'); return; }
        this.closePanels();
      }
      if (e.altKey && e.key === 'Tab'){
        e.preventDefault();
        const list = WM.wins.filter(w => !w.minimized && w.desk === WM.desk);
        if (list.length > 1){ const t = WM.top(); const i = list.indexOf(t); WM.focus(list[(i + 1) % list.length]); }
      }
    });
    addEventListener('keyup', e => {
      if (e.key === 'Meta') e.preventDefault();
    });
  },

  /* ================= ПИТАНИЕ ================= */
  power(act){
    $('#power-overlay').classList.remove('on');
    if (act === 'cancel') return;
    if (act === 'lock'){ this.lock(true); return; }
    if (act === 'sleep'){
      const f = el('div', 'shutdown-fade', '<div style="text-align:center;opacity:.7">Спящий режим…<br><small>Нажмите, чтобы разбудить</small></div>');
      document.body.appendChild(f);
      f.onclick = () => { f.remove(); this.lock(true); };
      return;
    }
    const f = el('div', 'shutdown-fade');
    f.innerHTML = act === 'restart'
      ? '<div style="text-align:center"><div class="boot-ring"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"/></svg></div><div style="margin-top:14px;opacity:.7">Перезагрузка…</div></div>'
      : '<div style="opacity:.6">Завершение работы…</div>';
    document.body.appendChild(f);
    setTimeout(() => location.reload(), act === 'restart' ? 1800 : 1500);
  },

  lock(on){
    const l = $('#lock');
    l.classList.toggle('gone', !on);
    document.body.classList.toggle('blurred', on);
    if (on) this.closePanels();
  }
};

</script>
<script>
/* ==========================================================================
   Запуск системы
   ========================================================================== */
'use strict';

(function boot(){
  applySettings();
  document.documentElement.style.fontSize = (16 * KV.get('zoom', 1)) + 'px';
  WM.init();
  Shell.init();

  // учёт недавних приложений
  const openOrig = WM.open.bind(WM);
  WM.open = (id, opts) => {
    const r = openOrig(id, opts);
    if (r){
      const rec = KV.get('recent', []).filter(x => x !== id);
      rec.unshift(id); KV.set('recent', rec.slice(0, 8));
      Shell.renderStart();
    }
    return r;
  };

  const boot = $('#boot'), lock = $('#lock'), desktop = $('#desktop');
  const skip = KV.get('skipBoot', false);

  const showDesktop = () => { desktop.classList.add('on'); };

  const unlock = () => {
    if (!lock.classList.contains('gone')){
      Shell.lock(false);
      Snd.blip(660, .12, 'sine', .04);
      setTimeout(() => Snd.blip(990, .16, 'sine', .035), 90);
      showDesktop();
    }
  };

  setTimeout(() => {
    boot.classList.add('gone');
    document.body.classList.add('blurred');
    setTimeout(() => boot.remove(), 700);
  }, skip ? 200 : 1900);

  lock.addEventListener('click', unlock);
  $('#lock-enter').addEventListener('click', e => { e.stopPropagation(); unlock(); });
  addEventListener('keydown', function once(e){
    if (lock.classList.contains('gone')) return;
    if (['Enter',' ','Escape'].includes(e.key)) unlock();
  });

  // адаптация окон при изменении размера экрана
  let rt = null;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      WM.wins.forEach(w => {
        const r = w.node.getBoundingClientRect();
        if (r.left > innerWidth - 100) w.node.style.left = (innerWidth - 200) + 'px';
        if (r.top > innerHeight - 60) w.node.style.top = (innerHeight - 200) + 'px';
        if (w.app.onResize) w.app.onResize(w);
      });
    }, 150);
  });

  // страховка: разблокировка первым кликом по документу
  addEventListener('mousedown', () => { Snd.ac(); }, { once:true });
})();

</script>
<script>
/* ==========================================================================
   Приближение к поведению настоящих ОС:
   свободные значки стола, реальная Корзина, автоскрытие верхней панели,
   превью окон в доке, Snap Assist, «Выполнить», системное меню окна,
   Aero Shake, настоящие батарея и сеть
   ========================================================================== */
'use strict';

(function realism(){

/* ==========================================================================
   1. Верхняя панель прячется, когда открыто хоть одно окно
   ========================================================================== */
const hot = el('div', 'top-hotzone');
$('#desktop').appendChild(hot);

Shell.updateChrome = function(){
  const busy = WM.wins.some(w => !w.minimized && w.desk === WM.desk);
  const peek = document.body.classList.contains('top-peek')
    || document.body.classList.contains('start-open')
    || $('#cc').classList.contains('on') || $('#widgets').classList.contains('on')
    || $('#taskview').classList.contains('on');
  const hide = S.topbarAutohide !== false && busy && !peek;
  document.body.classList.toggle('chrome-hidden', hide);
  const dw = $('#desk-widgets');
  if (dw) {                       // виджеты стола прячутся вместе с панелью
    dw.style.transition = 'opacity var(--t3) var(--e-io), transform var(--t3) var(--e-out)';
    dw.style.opacity = (busy && S.topbarAutohide !== false) ? '0' : '';
    dw.style.transform = (busy && S.topbarAutohide !== false) ? 'translateY(18px)' : '';
    dw.style.pointerEvents = busy ? 'none' : '';
  }
};
hot.addEventListener('mouseenter', () => { document.body.classList.add('top-peek'); Shell.updateChrome(); });
addEventListener('mousemove', e => {
  if (!document.body.classList.contains('top-peek')) return;
  if (e.clientY > 96){ document.body.classList.remove('top-peek'); Shell.updateChrome(); }
});
['syncDock','toggleStart','closePanels','panel','taskview'].forEach(fn => {
  const orig = Shell[fn].bind(Shell);
  Shell[fn] = (...a) => { const r = orig(...a); Shell.updateChrome(); return r; };
});

/* ==========================================================================
   2. Корзина: реальное удаление с восстановлением
   ========================================================================== */
const rmOrig = FS.rm.bind(FS);
FS.rm = function(path, name, permanent){
  const d = this.node(path), it = d && d.children[name];
  if (it && !permanent){
    const t = KV.get('trash', []);
    t.unshift({ name, path:path.slice(), node:JSON.parse(JSON.stringify(it)), ts:Date.now() });
    KV.set('trash', t.slice(0, 50));
  }
  return rmOrig(path, name);
};
const trashCount = () => KV.get('trash', []).length;

APPS.trash = {
  name:'Корзина', glyph:'🗑️', bg:'linear-gradient(140deg,#94a3b8,#475569)', w:600, h:460, single:true,
  render(win){
    const wrap = el('div', 'app col'); win.body.appendChild(wrap);
    const bar = el('div', 'toolbar');
    const list = el('div', 'scroll pad');
    wrap.append(bar, list);
    const empty = el('button', 'btn', '🧹 Очистить корзину');
    const restoreAll = el('button', 'btn', '↩ Восстановить всё');
    bar.append(restoreAll, empty, el('div', 'grow'));

    const restore = it => {
      const d = FS.node(it.path);
      if (!d){ Shell.toast('Корзина', 'Исходная папка не найдена', '⚠️'); return false; }
      d.children[it.name] = it.node; FS.save(); return true;
    };
    const draw = () => {
      const t = KV.get('trash', []);
      win.setSub(t.length ? t.length + ' эл.' : 'пусто');
      list.innerHTML = '';
      if (!t.length){ list.appendChild(el('div', 'empty', 'Корзина пуста')); Shell.renderIcons(); return; }
      t.forEach((it, i) => {
        const r = el('div', 'tr-row');
        r.innerHTML = `<div class="gl">${it.node.type === 'dir' ? '📁' : '📄'}</div>
          <div class="nm">${esc(it.name)}<div class="from">из /${esc(it.path.join('/'))} · ${new Date(it.ts).toLocaleString('ru-RU')}</div></div>`;
        const rb = el('button', 'btn', '↩ Восстановить');
        const db = el('button', 'btn', '✖');
        rb.onclick = () => { if (restore(it)){ t.splice(i, 1); KV.set('trash', t); draw(); Shell.renderIcons(); Shell.toast('Восстановлено', it.name, '↩'); } };
        db.onclick = () => { t.splice(i, 1); KV.set('trash', t); draw(); };
        r.append(rb, db);
        list.appendChild(r);
      });
      Shell.renderIcons();
    };
    empty.onclick = () => { if (confirm('Безвозвратно очистить корзину?')){ KV.set('trash', []); draw(); } };
    restoreAll.onclick = () => { const t = KV.get('trash', []); t.forEach(restore); KV.set('trash', []); draw(); Shell.renderIcons(); };
    draw();
  }
};

const dockTrash = $('#dock-trash');
dockTrash.onclick = () => WM.open('trash');
dockTrash.oncontextmenu = e => { e.preventDefault();
  Shell.ctx(e.clientX, e.clientY, [
    { i:'📂', t:'Открыть корзину', f:() => WM.open('trash') },
    { i:'🧹', t:'Очистить корзину', f:() => { KV.set('trash', []); Shell.renderIcons(); Shell.toast('Корзина', 'Очищена', '🗑️'); } }]); };

/* ==========================================================================
   3. Значки рабочего стола: свободное размещение, рамка выделения, клавиши
   ========================================================================== */
const ICONW = 100, ICONH = 106, TOPPAD = 88, LEFTPAD = 14;

Shell.renderIcons = function(){
  const box = $('#desktop-icons');
  box.innerHTML = '';
  const pos = KV.get('iconPos', {});
  const rows = Math.max(1, Math.floor((innerHeight - TOPPAD - 130) / ICONH));

  const items = [
    { g:'💻', n:'Этот компьютер', open:() => WM.open('files', { path:[] }) },
    { g: trashCount() ? '🗑️' : '🗑', n:'Корзина', open:() => WM.open('trash') }
  ];
  const desk = FS.node(['Рабочий стол']);
  Object.values(desk ? desk.children : {}).forEach(f => items.push({
    g: f.type === 'dir' ? '📁' : f.img ? '🖼️' : '📄', n:f.name, file:f,
    open: () => f.type === 'dir' ? WM.open('files', { path:['Рабочий стол', f.name] })
        : f.img ? WM.open('photos', { img:f.img, name:f.name })
        : WM.open('notepad', { file:{ name:f.name, path:['Рабочий стол'], body:f.body } })
  }));

  items.forEach((it, i) => {
    const n = el('div', 'di', `<div class="glyph">${it.g}</div><div class="lbl">${esc(it.n)}</div>`);
    n.tabIndex = 0;
    n.dataset.name = it.n;
    const p = pos[it.n] || { x:LEFTPAD + Math.floor(i / rows) * ICONW, y:TOPPAD + (i % rows) * ICONH };
    n.style.left = clamp(p.x, 0, innerWidth - 100) + 'px';
    n.style.top = clamp(p.y, 60, innerHeight - 150) + 'px';
    n._it = it;

    n.addEventListener('mousedown', e => {
      e.stopPropagation();
      if (!e.ctrlKey && !e.metaKey && !n.classList.contains('sel'))
        $$('.di', box).forEach(x => x.classList.remove('sel'));
      n.classList.add('sel'); n.focus();

      const sx = e.clientX, sy = e.clientY;
      const start = $$('.di.sel', box).map(d => ({ d, x:parseFloat(d.style.left), y:parseFloat(d.style.top) }));
      let moved = false;
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 5) return;
        moved = true;
        start.forEach(s => {
          s.d.classList.add('drag');
          s.d.style.left = clamp(s.x + dx, 0, innerWidth - 100) + 'px';
          s.d.style.top = clamp(s.y + dy, 60, innerHeight - 150) + 'px';
        });
      };
      const up = () => {
        document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
        if (moved){
          const P = KV.get('iconPos', {});
          start.forEach(s => { s.d.classList.remove('drag');
            P[s.d.dataset.name] = { x:parseFloat(s.d.style.left), y:parseFloat(s.d.style.top) }; });
          KV.set('iconPos', P);
        }
      };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
    });

    n.ondblclick = it.open;
    n.onkeydown = e => {
      if (e.key === 'Enter') it.open();
      else if (e.key === 'F2' && it.file) renameIcon(it);
      else if (e.key === 'Delete' && it.file) delIcon(it);
    };
    n.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      $$('.di', box).forEach(x => x.classList.remove('sel')); n.classList.add('sel');
      Shell.ctx(e.clientX, e.clientY, [
        { i:'📂', t:'Открыть', f:it.open, k:'Enter' },
        ...(it.n === 'Корзина' ? [{ i:'🧹', t:'Очистить корзину', f:() => { KV.set('trash', []); Shell.renderIcons(); Shell.toast('Корзина', 'Очищена', '🗑️'); } }] : []),
        ...(it.file ? [
          { i:'✏️', t:'Переименовать', f:() => renameIcon(it), k:'F2' },
          { i:'🗑️', t:'Удалить', f:() => delIcon(it), k:'Del' }] : []),
        'hr',
        { i:'⬛', t:'Выровнять значки', f:() => { KV.set('iconPos', {}); Shell.renderIcons(); } }
      ]);
    };
    box.appendChild(n);
  });

  function renameIcon(it){
    const nn = prompt('Новое имя', it.n);
    if (!nn || nn === it.n) return;
    FS.rename(['Рабочий стол'], it.n, nn);
    const P = KV.get('iconPos', {});
    if (P[it.n]){ P[nn] = P[it.n]; delete P[it.n]; KV.set('iconPos', P); }
    Shell.renderIcons();
  }
  function delIcon(it){
    FS.rm(['Рабочий стол'], it.n);
    Shell.toast('Удалено', it.n + ' перемещён в корзину', '🗑️');
    Shell.renderIcons();
  }
};

/* рамка выделения на пустом месте стола */
$('#desktop').addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (e.target.closest('.win, .dock, .start, .di, #cc, #widgets, .topbar, .ctx, .desk-widgets')) return;
  $$('.di').forEach(x => x.classList.remove('sel'));
  const sx = e.clientX, sy = e.clientY;
  const m = el('div', 'marquee');
  let live = false;
  const mv = ev => {
    const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY);
    const w = Math.abs(ev.clientX - sx), h = Math.abs(ev.clientY - sy);
    if (!live && w + h < 8) return;
    if (!live){ live = true; $('#desktop-icons').appendChild(m); }
    Object.assign(m.style, { left:x + 'px', top:y + 'px', width:w + 'px', height:h + 'px' });
    $$('.di').forEach(d => {
      const r = d.getBoundingClientRect();
      d.classList.toggle('sel', !(r.right < x || r.left > x + w || r.bottom < y || r.top > y + h));
    });
  };
  const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); m.remove(); };
  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
});

/* ==========================================================================
   4. Превью открытых окон в доке
   ========================================================================== */
const prev = el('div', 'dock-prev glass lg');
$('#desktop').appendChild(prev);
let prevTimer = null;

function showPrev(btn, appId){
  const wins = WM.wins.filter(w => w.appId === appId);
  if (!wins.length){ hidePrev(); return; }

const assist = el('div', 'snap-assist');

WM.snap = function(win, zone){

  const cands = WM.wins.filter(w => w !== win && !w.minimized && w.desk === WM.desk);
  if (!cands.length) return;

};

<script>
/* ==========================================================================
   Файловая подсистема второго поколения:
   метаданные, буфер обмена, полноценный Проводник,
   импорт настоящих файлов перетаскиванием и выгрузка на реальный диск
   ========================================================================== */
'use strict';

(function fs2(){

/* ---------- метаданные ---------- */
const sizeOf = n => n.type === 'dir'
  ? Object.values(n.children || {}).reduce((s, c) => s + sizeOf(c), 0)
  : (n.img ? Math.round(n.img.length * 0.75) : new Blob([n.body || '']).size);
const fmtSize = b => b < 1024 ? b + ' Б' : b < 1048576 ? (b / 1024).toFixed(1) + ' КБ' : (b / 1048576).toFixed(2) + ' МБ';
const fmtDate = t => t ? new Date(t).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
const extOf = n => n.type === 'dir' ? 'Папка' : (n.name.match(/\.([a-z0-9]+)$/i) || [,''])[1].toUpperCase() + ' файл';
const glyphOf = n => n.type === 'dir' ? '📁' : n.img ? '🖼️' : /\.(md|txt|log)$/i.test(n.name) ? '📄'
  : /\.(js|json|css|html|py)$/i.test(n.name) ? '📜' : /\.(mp3|wav|ogg)$/i.test(n.name) ? '🎵' : '📦';

const writeOrig = FS.write.bind(FS);
FS.write = function(path, name, body){
  const d = this.node(path); if (!d || d.type !== 'dir') return false;
  const old = d.children[name];
  const r = writeOrig(path, name, body);
  const n = d.children[name];
  if (n){ n.ctime = (old && old.ctime) || Date.now(); n.mtime = Date.now(); this.save(); }
  return r;
};
const mkdirOrig = FS.mkdir.bind(FS);
FS.mkdir = function(path, name){
  const r = mkdirOrig(path, name);
  const n = this.node([...path, name]);
  if (n){ n.ctime = n.mtime = Date.now(); this.save(); }
  return r;
};
FS.put = function(path, node){                    // положить готовый узел
  const d = this.node(path); if (!d) return false;
  let name = node.name, i = 1;
  while (d.children[name]) name = node.name.replace(/(\.[^.]+)?$/, ` (${i++})$1`);
  d.children[name] = { ...node, name, ctime:node.ctime || Date.now(), mtime:Date.now() };
  this.save(); return name;
};
FS.uniqueName = function(path, name){
  const d = this.node(path); if (!d) return name;
  let n = name, i = 1;
  while (d.children[n]) n = name.replace(/(\.[^.]+)?$/, ` (${i++})$1`);
  return n;
};

/* даты для файлов, созданных до появления метаданных */
(function migrate(){
  if (KV.get('fs.migrated', false)) return;
  const t = Date.now() - 86400000;
  (function walk(n){ Object.values(n.children || {}).forEach(c => {
    if (!c.ctime) c.ctime = t;
    if (!c.mtime) c.mtime = t;
    if (c.type === 'dir') walk(c);
  }); })(FS.root);
  FS.save(); KV.set('fs.migrated', true);
})();

/* ---------- буфер обмена ---------- */
const Clip = { items:[], cut:false,
  copy(path, names){ this.items = names.map(n => ({ path:path.slice(), name:n })); this.cut = false; },
  take(path, names){ this.copy(path, names); this.cut = true; },
  paste(path){
    if (!this.items.length) return 0;
    let k = 0;
    this.items.forEach(it => {
      const src = FS.node([...it.path, it.name]); if (!src) return;
      if (String(it.path) === String(path) && this.cut) return;
      FS.put(path, JSON.parse(JSON.stringify(src)));
      if (this.cut) FS.rm(it.path, it.name, true);
      k++;
    });
    if (this.cut) this.items = [];
    return k;
  }
};

/* ---------- выгрузка на настоящий диск ---------- */
async function download(node){
  // если браузер умеет File System Access — показываем настоящий диалог сохранения
  if (window.showSaveFilePicker){
    try {
      const h = await showSaveFilePicker({ suggestedName:node.name });
      const w = await h.createWritable();
      await w.write(node.img ? await (await fetch(node.img)).blob() : new Blob([node.body || ''], { type:'text/plain;charset=utf-8' }));
      await w.close();
      Shell.toast('Сохранено', node.name + ' записан на диск', '💾');
      return;
    } catch(e){ if (e && e.name === 'AbortError') return; }   // пользователь отменил
  }
  const a = document.createElement('a');
  a.setAttribute('download', node.name || 'file.txt');
  // data: вместо blob: — при открытии по file:// blob имеет opaque origin
  // и Chromium игнорирует имя файла из атрибута download
  a.href = node.img || ('data:text/plain;charset=utf-8,' + encodeURIComponent(node.body || ''));
  a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => a.remove(), 1000);
  Shell.toast('Выгружено', node.name + ' сохранён на ваш компьютер', '⬇️');
}

/* ---------- импорт настоящих файлов ---------- */
function importFiles(fileList, path){
  const files = [...fileList];
  let done = 0;
  files.forEach(f => {
    const r = new FileReader();
    const img = /^image\//.test(f.type);
    r.onload = () => {
      const node = img ? { type:'file', name:f.name, img:r.result, body:'' }
                       : { type:'file', name:f.name, body:String(r.result).slice(0, 400000) };
      node.ctime = f.lastModified; node.mtime = f.lastModified;
      FS.put(path, node);
      if (++done === files.length){
        Shell.toast('Импортировано', `${files.length} ф. → /${path.join('/')}`, '📥');
        Shell.renderIcons();
        WM.wins.filter(w => w.appId === 'files' && w.data.refresh).forEach(w => w.data.refresh());
      }
    };
    if (img) r.readAsDataURL(f); else r.readAsText(f);
  });
}
window.__win12Import = importFiles;

/* приём файлов, перетащенных из настоящей ОС на рабочий стол */
const dropHint = el('div', 'drop-hint', '<div>📥<br>Отпустите — файлы попадут на рабочий стол</div>');
document.body.appendChild(dropHint);
let dragDepth = 0;
addEventListener('dragenter', e => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;

});
addEventListener('dragover', e => { if ([...(e.dataTransfer||{types:[]}).types].includes('Files')) e.preventDefault(); });
addEventListener('dragleave', e => { if (--dragDepth <= 0){ dragDepth = 0; dropHint.classList.remove('on'); } });
addEventListener('drop', e => {

  e.preventDefault(); dragDepth = 0; dropHint.classList.remove('on');

  const path = (w && w.appId === 'files' && w.data.path) ? w.data.path : ['Рабочий стол'];
  importFiles(e.dataTransfer.files, path);
});

/* ==========================================================================
   ПРОВОДНИК
   ========================================================================== */
APPS.files = {
  name:'Проводник', glyph:'📁', bg:'linear-gradient(140deg,#fcd34d,#f59e0b)', w:940, h:600,
  render(win, opts){
    let path = [], hist = [], hp = -1, sel = [], last = null;
    let view = KV.get('files.view', 'grid'), sort = KV.get('files.sort', 'name'), q = '';

    const wrap = el('div', 'app'); win.body.appendChild(wrap);
    const side = el('div', 'sidebar');
    const main = el('div', 'col grow');
    const bar = el('div', 'toolbar');
    const bar2 = el('div', 'toolbar');
    const list = el('div', 'scroll');
    const status = el('div', 'statusbar');
    main.append(bar, bar2, list, status); wrap.append(side, main);

    /* --- боковая панель --- */
    const quick = [['🏠','Этот компьютер',[]],['🖥️','Рабочий стол',['Рабочий стол']],['📄','Документы',['Документы']],
                   ['🖼️','Изображения',['Изображения']],['🎵','Музыка',['Музыка']],['⬇️','Загрузки',['Загрузки']]];
    side.appendChild(el('div', 'sb-title', 'Быстрый доступ'));
    quick.forEach(([e, n, p]) => {
      const b = el('button', 'sb-item', `<span>${e}</span><span>${n}</span>`);
      b.onclick = () => go(p);

    /* --- панели инструментов --- */
    bar.innerHTML = `<button class="btn" data-a="back" title="Назад">‹</button>
      <button class="btn" data-a="fwd" title="Вперёд">›</button>
      <button class="btn" data-a="up" title="Вверх">↑</button>
      <div class="fe-crumbs"></div>
      <input class="inp fe-find" placeholder="🔎 Поиск в папке" style="width:170px">`;
    bar2.innerHTML = `<button class="btn" data-a="nf">📁 Папка</button>
      <button class="btn" data-a="nt">📄 Файл</button>
      <span class="fe-sep"></span>
      <button class="btn" data-a="copy">⧉ Копировать</button>
      <button class="btn" data-a="cut">✂ Вырезать</button>
      <button class="btn" data-a="paste">📋 Вставить</button>
      <button class="btn" data-a="ren">✏️ Имя</button>
      <button class="btn" data-a="del">🗑️ Удалить</button>
      <button class="btn" data-a="dl">⬇️ Скачать</button>
      <div class="grow"></div>
      <select class="inp" data-a="sort" style="width:130px">
        <option value="name">По имени</option><option value="size">По размеру</option>
        <option value="date">По дате</option><option value="type">По типу</option></select>
      <button class="btn" data-a="view">▦</button>`;
    const crumbs = $('.fe-crumbs', bar);
    const find = $('.fe-find', bar);
    $('[data-a="sort"]', bar2).value = sort;

    /* --- навигация --- */
    const go = (p, push = true) => {
      path = p.slice(); sel = []; q = ''; find.value = '';
      if (push){ hist.splice(hp + 1); hist.push(path.slice()); hp = hist.length - 1; }

      const node = FS.node(path) || FS.root;

      if (q) arr = arr.filter(i => i.name.toLowerCase().includes(q));
      const dir = (a, b) => a.type === b.type ? 0 : a.type === 'dir' ? -1 : 1;

        sort === 'type' ? extOf(a).localeCompare(extOf(b)) || a.name.localeCompare(b.name) :

    }

      });

      list.innerHTML = '';
      const cont = el('div', view === 'grid' ? 'fe-grid' : 'fe-table');

      if (view === 'table'){
