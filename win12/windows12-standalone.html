        cont.appendChild(h);
      }

      arr.forEach(it => {
        const n = el('div', view === 'grid' ? 'fe-it' : 'fe-tr');
        n.innerHTML = view === 'grid'
          ? `<div class="gl">${glyphOf(it)}</div><div class="nm">${esc(it.name)}</div>`
          : `<div class="c1"><span class="gl">${glyphOf(it)}</span>${esc(it.name)}</div>
             <div>${fmtDate(it.mtime)}</div><div>${extOf(it)}</div>
             <div>${it.type === 'dir' ? '' : fmtSize(sizeOf(it))}</div>`;
        n.dataset.name = it.name;
        n.classList.toggle('sel', sel.includes(it.name));
        n.draggable = true;

        n.onclick = e => {
          e.stopPropagation();
          if (e.shiftKey && last){
            const names = arr.map(x => x.name);
            const a = names.indexOf(last), b = names.indexOf(it.name);
            sel = names.slice(Math.min(a, b), Math.max(a, b) + 1);
          } else if (e.ctrlKey || e.metaKey){
            sel = sel.includes(it.name) ? sel.filter(x => x !== it.name) : [...sel, it.name];
            last = it.name;
          } else { sel = [it.name]; last = it.name; }
          paint();
        };
        n.ondblclick = () => open(it);
        n.ondragstart = e => {
          if (!sel.includes(it.name)) { sel = [it.name]; paint(); }
          e.dataTransfer.setData('text/win12', JSON.stringify(sel));
          e.dataTransfer.effectAllowed = 'move';
        };
        if (it.type === 'dir'){
          n.ondragover = e => { e.preventDefault(); n.classList.add('drop'); };
          n.ondragleave = () => n.classList.remove('drop');
          n.ondrop = e => {
            e.preventDefault(); e.stopPropagation(); n.classList.remove('drop');
            if (e.dataTransfer.files.length) return importFiles(e.dataTransfer.files, [...path, it.name]);
            const names = JSON.parse(e.dataTransfer.getData('text/win12') || '[]').filter(x => x !== it.name);
            if (!names.length) return;
            Clip.take(path, names); Clip.paste([...path, it.name]); sel = []; draw();
          };
        }
        n.oncontextmenu = e => {
          e.preventDefault(); e.stopPropagation();
          if (!sel.includes(it.name)){ sel = [it.name]; paint(); }
          Shell.ctx(e.clientX, e.clientY, [
            { i:'📂', t:'Открыть', f:() => open(it), k:'Enter' },
            'hr',
            { i:'⧉', t:'Копировать', f:() => act('copy'), k:'Ctrl+C' },
            { i:'✂', t:'Вырезать', f:() => act('cut'), k:'Ctrl+X' },
            { i:'✏️', t:'Переименовать', f:() => act('ren'), k:'F2' },
            { i:'⬇️', t:'Скачать на компьютер', f:() => act('dl') },
            'hr',
            { i:'🗑️', t:'Удалить', f:() => act('del'), k:'Del' },
            { i:'ℹ️', t:'Свойства', f:() => props(it) }
          ]);
        };
        cont.appendChild(n);
      });

      if (!arr.length) cont.appendChild(el('div', 'empty', q ? 'Ничего не найдено' : 'Папка пуста'));
      list.appendChild(cont);
      paint();
    }

    function paint(){
      $$('.fe-it[data-name], .fe-tr[data-name]', list)
        .forEach(n => n.classList.toggle('sel', sel.includes(n.dataset.name)));
      const node = FS.node(path) || FS.root;
      const total = Object.keys(node.children || {}).length;
      const selSize = sel.reduce((s, n) => { const x = FS.node([...path, n]); return s + (x ? sizeOf(x) : 0); }, 0);
      status.innerHTML = `<span>Элементов: ${total}</span>
        ${sel.length ? `<span>Выбрано: ${sel.length} · ${fmtSize(selSize)}</span>` : ''}
        <span class="grow"></span>
        ${Clip.items.length ? `<span>В буфере: ${Clip.items.length}${Clip.cut ? ' (вырезано)' : ''}</span>` : ''}
        <span>${view === 'grid' ? 'Плитка' : 'Таблица'}</span>`;
    }

    function open(it){
      if (it.type === 'dir') return go([...path, it.name]);
      if (opts && opts.pick){ opts.pick({ name:it.name, path:path.slice(), body:it.body }); win.close(); return; }
      if (it.img) WM.open('photos', { img:it.img, name:it.name });
      else WM.open('notepad', { file:{ name:it.name, path:path.slice(), body:it.body } });
    }

    function props(it){
      alert(`Свойства\n\nИмя: ${it.name}\nТип: ${extOf(it)}\nРазмер: ${fmtSize(sizeOf(it))}\n` +
        `Расположение: /${path.join('/')}\nСоздан: ${fmtDate(it.ctime)}\nИзменён: ${fmtDate(it.mtime)}` +
        (it.type === 'dir' ? `\nЭлементов внутри: ${Object.keys(it.children || {}).length}` : ''));
    }

    /* --- действия --- */
    function act(a){
      switch(a){
        case 'back': if (hp > 0){ hp--; go(hist[hp], false); } break;
        case 'fwd':  if (hp < hist.length - 1){ hp++; go(hist[hp], false); } break;
        case 'up':   if (path.length) go(path.slice(0, -1)); break;
        case 'nf': { const n = prompt('Имя папки', 'Новая папка'); if (n){ FS.mkdir(path, FS.uniqueName(path, n)); draw(); } break; }
        case 'nt': { const n = prompt('Имя файла', 'Новый.txt'); if (n){ FS.write(path, FS.uniqueName(path, n), ''); draw(); } break; }
        case 'copy': if (sel.length){ Clip.copy(path, sel); paint(); Shell.toast('Скопировано', sel.length + ' эл. в буфере', '⧉'); } break;
        case 'cut':  if (sel.length){ Clip.take(path, sel); paint(); } break;
        case 'paste': { const k = Clip.paste(path); if (k){ draw(); Shell.toast('Вставлено', k + ' эл.', '📋'); } break; }
        case 'ren': { if (sel.length !== 1) return;
          const nn = prompt('Новое имя', sel[0]); if (nn && nn !== sel[0]){ FS.rename(path, sel[0], nn); sel = [nn]; draw(); } break; }
        case 'del': { if (!sel.length) return;
          if (!confirm(`Переместить в корзину: ${sel.length} эл.?`)) return;
          sel.forEach(n => FS.rm(path, n)); sel = []; draw(); Shell.renderIcons(); break; }
        case 'dl': { sel.forEach(n => { const x = FS.node([...path, n]); if (x && x.type === 'file') download(x); }); break; }
        case 'view': view = view === 'grid' ? 'table' : 'grid'; KV.set('files.view', view);
          $('[data-a="view"]', bar2).textContent = view === 'grid' ? '▦' : '☰'; draw(); break;
      }
    }
    $$('[data-a]', bar).forEach(b => b.onclick = () => act(b.dataset.a));
    $$('[data-a]', bar2).forEach(b => { if (b.tagName === 'BUTTON') b.onclick = () => act(b.dataset.a); });
    $('[data-a="sort"]', bar2).onchange = e => { sort = e.target.value; KV.set('files.sort', sort); draw(); };
    find.oninput = () => { q = find.value.trim().toLowerCase(); draw(); };

    /* --- клавиатура --- */
    win.node.addEventListener('keydown', e => {
      if (/INPUT|TEXTAREA/.test(e.target.tagName)) return;
      const arr = items();
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k === 'a'){ e.preventDefault(); sel = arr.map(i => i.name); paint(); }
      else if ((e.ctrlKey || e.metaKey) && k === 'c'){ act('copy'); }
      else if ((e.ctrlKey || e.metaKey) && k === 'x'){ act('cut'); }
      else if ((e.ctrlKey || e.metaKey) && k === 'v'){ act('paste'); }
      else if (e.key === 'Delete'){ act('del'); }
      else if (e.key === 'F2'){ act('ren'); }
      else if (e.key === 'Backspace'){ act('up'); }
      else if (e.key === 'Enter'){ const it = FS.node([...path, sel[0]]); if (it) open(it); }
      else if (e.key === 'Escape'){ sel = []; paint(); }
    });

    /* --- фон списка --- */
    list.onclick = () => { sel = []; paint(); };
    list.oncontextmenu = e => {
      if (e.target.closest('.fe-it, .fe-tr')) return;
      e.preventDefault();
      Shell.ctx(e.clientX, e.clientY, [
        { i:'📁', t:'Создать папку', f:() => act('nf') },
        { i:'📄', t:'Создать файл', f:() => act('nt') },
        { i:'📋', t:'Вставить', f:() => act('paste'), k:'Ctrl+V' },
        'hr',
        { i:'🔄', t:'Обновить', f:draw, k:'F5' },
        { i:'📥', t:'Импорт с компьютера…', f:() => {
            const inp = el('input'); inp.type = 'file'; inp.multiple = true;
            inp.onchange = () => importFiles(inp.files, path); inp.click(); } }
      ]);
    };
    list.ondragover = e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); };

    win.node.tabIndex = 0;
    go(opts && opts.path ? opts.path : ['Документы']);
  }
};

/* ==========================================================================
   Блокнот: поиск/замена и «Скачать»
   ========================================================================== */
const npRender = APPS.notepad.render;
APPS.notepad.render = function(win, opts){
  npRender.call(this, win, opts);
  const bar = $('.toolbar', win.body), area = $('.np-area', win.body);
  if (!bar || !area) return;

  const dl = el('button', 'btn', '⬇️ Скачать');
  dl.onclick = () => download({ name:(win.titleEl.textContent.split(' — ')[0] || 'file.txt'), body:area.value });
  const fnd = el('button', 'btn', '🔎 Найти');
  bar.insertBefore(fnd, bar.querySelector('.grow'));
  bar.insertBefore(dl, bar.querySelector('.grow'));

  const panel = el('div', 'np-find');
  panel.innerHTML = `<input class="inp" placeholder="Найти"><input class="inp" placeholder="Заменить на">
    <button class="btn" data-a="next">↓</button><button class="btn" data-a="all">Заменить всё</button>
    <span class="tiny muted cnt"></span><button class="btn" data-a="close">×</button>`;
    win.body.querySelector('.app').insertBefore(panel, area);
  const [qi, ri] = $$('input', panel);
  let pos = 0;
  const count = () => {
    const v = qi.value; if (!v) return $('.cnt', panel).textContent = '';
    const n = area.value.split(v).length - 1;
    $('.cnt', panel).textContent = n ? `совпадений: ${n}` : 'не найдено';
  };
  const next = () => {
    const v = qi.value; if (!v) return;
    const i = area.value.indexOf(v, pos);
    const j = i < 0 ? area.value.indexOf(v) : i;
    if (j < 0) return;
    area.focus(); area.setSelectionRange(j, j + v.length); pos = j + v.length;
  };
  qi.oninput = () => { pos = 0; count(); };
  qi.onkeydown = e => { if (e.key === 'Enter') next(); if (e.key === 'Escape') panel.classList.remove('on'); };
  $('[data-a="next"]', panel).onclick = next;
  $('[data-a="all"]', panel).onclick = () => {
    if (!qi.value) return;
    const n = area.value.split(qi.value).length - 1;
    area.value = area.value.split(qi.value).join(ri.value);
    area.dispatchEvent(new Event('input')); count();
    Shell.toast('Блокнот', `Заменено: ${n}`, '🔁');
  };
  $('[data-a="close"]', panel).onclick = () => panel.classList.remove('on');
  const openFind = () => { panel.classList.add('on'); qi.focus(); qi.select(); count(); };
  fnd.onclick = openFind;
  area.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){ e.preventDefault(); openFind(); }
  });
};

/* ==========================================================================
   Полноэкранный режим и системные уведомления
   ========================================================================== */
addEventListener('keydown', e => {
  if (e.key === 'F11'){
    e.preventDefault();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});
const toastOrig = Shell.toast.bind(Shell);
Shell.toast = function(title, text, icon, ms){
  toastOrig(title, text, icon, ms);
  if (document.hidden && window.Notification && Notification.permission === 'granted')
    try { new Notification(title, { body:text }); } catch(e){}
};
document.addEventListener('click', function once(){
  if (window.Notification && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  document.removeEventListener('click', once);
}, { once:true });

})();

</script>
<script>
/* ==========================================================================
   Панель задач в стиле Windows, управляемые виджеты стола,
   расширенный терминал и Музыка со своими аудиофайлами
   ========================================================================== */
'use strict';

/* ---------- IndexedDB для больших данных (аудио, свои обои) ---------- */
const IDB = {
  db:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('win12', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('blobs');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode){ const db = await this.open(); return db.transaction('blobs', mode).objectStore('blobs'); },
  async put(k, v){ const s = await this.tx('readwrite'); return new Promise(r => { s.put(v, k).onsuccess = () => r(true); }); },
  async get(k){ const s = await this.tx('readonly'); return new Promise(r => { const q = s.get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); },
  async del(k){ const s = await this.tx('readwrite'); return new Promise(r => { s.delete(k).onsuccess = () => r(true); }); }
};
window.IDB = IDB;

(function tweaks(){

/* ==========================================================================
   1. Нижняя панель: док ↔ панель задач Windows
   ========================================================================== */
const dock = $('#dock');
const tray = $('#tb-tray');
const topbar = $('.topbar');
const hot = $('.top-hotzone');
if (hot) hot.remove();                       // верхняя панель больше не выезжает по наведению

const tbSearch = el('button', 'tb-dock-search', `<svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Поиск</span>`);
tbSearch.onclick = () => Shell.spot(true);
tbSearch.dataset.tip = 'Поиск (Win+Space)';

Shell.updateTaskbar = function(){
  const mine = WM.wins.filter(w => w.desk === WM.desk && !w.minimized);
  const anyMax = mine.some(w => w.maximized);
  const busy = mine.length > 0;

  document.body.classList.toggle('taskbar', anyMax && S.taskbarFull !== false);

  // трей переезжает в панель, когда верхняя панель скрыта
  const inDock = busy && S.trayInDock !== false;
  if (inDock && tray.parentElement !== dock){
    dock.appendChild(tray); tray.classList.add('in-dock');
    dock.insertBefore(tbSearch, $('#dock-items', dock));
  } else if (!inDock && tray.parentElement !== topbar){
    topbar.appendChild(tray); tray.classList.remove('in-dock');
    tbSearch.remove();
  }

  // развёрнутые окна не должны залезать под панель задач
  WM.wins.filter(w => w.maximized).forEach(w => {
    const m = WM.maxRect();
    Object.assign(w.node.style, { left:m.left + 'px', top:m.top + 'px', width:m.width + 'px', height:m.height + 'px' });
    if (w.app.onResize) w.app.onResize(w);
  });
};

['syncDock','updateChrome'].forEach(fn => {
  const orig = Shell[fn].bind(Shell);
  Shell[fn] = (...a) => { const r = orig(...a); Shell.updateTaskbar(); return r; };
});
const maxOrig = WM.toggleMax.bind(WM);
WM.toggleMax = w => { maxOrig(w); setTimeout(() => Shell.updateTaskbar(), 30); };

/* ==========================================================================
   2. Виджеты рабочего стола: свои, перемещаемые, удаляемые
   ========================================================================== */
const WIDGETS = {
  clock:{ n:'Часы', e:'🕐', h(){ const d = new Date();
    return `<div class="w-t">Часы</div><div class="w-big dw-clock">${pad2(d.getHours())}:${pad2(d.getMinutes())}</div>
      <div class="tiny muted">${d.toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' })}</div>`; } },
  weather:{ n:'Погода', e:'🌤', h(){ const w = Shell.weather();
    return `<div class="w-t">Погода · ${esc(S.city)}${w.real ? '' : ' · демо'}</div><div class="row"><div style="font-size:30px">${w.ico}</div>
      <div><div class="w-big">${w.t > 0 ? '+' : ''}${w.t}°</div><div class="tiny muted">${w.desc}</div></div></div>`; } },
  calendar:{ n:'Календарь', e:'📅', h(){ const d = new Date();
    const ev = Object.entries(KV.get('cal.events', {})).slice(0, 2);
    return `<div class="w-t">Календарь</div><div class="w-big">${d.getDate()}</div>
      <div class="tiny muted">${d.toLocaleDateString('ru-RU', { weekday:'long', month:'long' })}</div>
      ${ev.map(([, v]) => `<div class="w-row"><span>${esc(v)}</span></div>`).join('')}`; } },
  tasks:{ n:'Задачи', e:'✅', h(){ const t = KV.get('todo', []).filter(x => !x.d).slice(0, 4);
    return `<div class="w-t">Задачи</div>${t.length ? t.map(x => `<div class="w-row"><span>○ ${esc(x.t)}</span></div>`).join('')
      : '<div class="w-row muted">Всё сделано 🎉</div>'}`; } },
  system:{ n:'Система', e:'📊', h(){
    return `<div class="w-t">Система</div>
      <div class="w-row"><span>Окон</span><b>${WM.wins.length}</b></div>
      <div class="w-row"><span>Стол</span><b>${WM.desk + 1}/${WM.desks}</b></div>
      <div class="w-row"><span>Размытие</span><b>${S.blur}px</b></div>`; } },
  note:{ n:'Заметка', e:'📝', h(){
    return `<div class="w-t">Заметка</div><div class="dw-note" contenteditable spellcheck="false">${esc(KV.get('dwNote', 'Нажмите и пишите…'))}</div>`; } }
};
window.WIDGETS = WIDGETS;

Shell.renderDeskWidgets = function(){
  const box = $('#desk-widgets');
  if (!box) return;
  box.innerHTML = '';
  if (!S.showDeskWidgets) return;

  (S.deskWidgets || []).forEach((w, i) => {
    const def = WIDGETS[w.t]; if (!def) return;
    const n = el('div', 'w-card glass dw', def.h());
    n.style.left = (w.x != null ? w.x : innerWidth - 260) + 'px';
    n.style.top  = (w.y != null ? w.y : 96 + i * 140) + 'px';
    n.appendChild(el('button', 'dw-x', '×'));
    $('.dw-x', n).onclick = e => { e.stopPropagation(); removeWidget(i); };

    const note = $('.dw-note', n);
    if (note) note.onblur = () => KV.set('dwNote', note.textContent.trim());

    n.addEventListener('mousedown', e => {
      if (e.target.closest('.dw-x, .dw-note')) return;
      const r = n.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
      let moved = false;
      const mv = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.hypot(dx, dy) < 4) return;
        moved = true; n.classList.add('drag');
        n.style.left = clamp(r.left + dx, 4, innerWidth - r.width - 4) + 'px';
        n.style.top  = clamp(r.top + dy, 4, innerHeight - r.height - 20) + 'px';
      };
      const up = () => {
        document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
        n.classList.remove('drag');
        if (moved){ S.deskWidgets[i].x = parseFloat(n.style.left); S.deskWidgets[i].y = parseFloat(n.style.top); Store.save(); }
      };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
    });

    n.oncontextmenu = e => {
      e.preventDefault(); e.stopPropagation();
      Shell.ctx(e.clientX, e.clientY, [
        { i:'🗑️', t:'Убрать виджет', f:() => removeWidget(i) },
        'hr',
        ...Object.entries(WIDGETS).map(([k, d]) => ({ i:d.e, t:'Добавить: ' + d.n, f:() => addWidget(k) }))
      ]);
    };
    box.appendChild(n);
  });
};
function addWidget(t){
  S.deskWidgets = S.deskWidgets || [];
  S.deskWidgets.push({ t, x:innerWidth - 260, y:96 + S.deskWidgets.length * 140 });
  if (!S.showDeskWidgets) S.showDeskWidgets = true;
  Store.save(); Shell.renderDeskWidgets();
  Shell.toast('Виджеты', WIDGETS[t].n + ' добавлен на рабочий стол', WIDGETS[t].e);
}
function removeWidget(i){ S.deskWidgets.splice(i, 1); Store.save(); Shell.renderDeskWidgets(); }
window.addWidget = addWidget;

/* добавление виджетов из контекстного меню рабочего стола */
$('#desktop').addEventListener('contextmenu', e => {
  if (e.target.closest('.win, .dock, .start, .di, #cc, #widgets, .w-card')) return;
  setTimeout(() => {
    const c = $('#ctx');
    if (!c.classList.contains('on')) return;
    const b = el('button', '', `<span class="em">🧩</span><span>Добавить виджет…</span>`);
    b.onclick = () => {
      c.classList.remove('on');
      Shell.ctx(e.clientX, e.clientY, Object.entries(WIDGETS).map(([k, d]) => ({ i:d.e, t:d.n, f:() => addWidget(k) })));
    };
    c.insertBefore(b, c.children[3] || null);
  }, 0);
});

/* часы в виджете идут */
setInterval(() => {
  const c = $('.dw-clock');
  if (c){ const d = new Date(); c.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
}, 1000);

/* ==========================================================================
   3. Терминал: полноценный набор команд
   ========================================================================== */
APPS.term = {
  name:'Терминал', glyph:'⌨️', bg:'linear-gradient(140deg,#334155,#0f172a)', w:820, h:520,
  render(win){
    let cwd = [];
    const out = el('div', 'term'); win.body.appendChild(out);
    const inLine = el('div', 'term-in');
    const prompt = el('span', 'pr');
    const inp = el('input'); inp.spellcheck = false; inp.autocapitalize = 'off';
    inLine.append(prompt, inp); out.appendChild(inLine);
    const print = (t, c = '') => { const l = el('div', 'term-line ' + c); l.innerHTML = t; out.insertBefore(l, inLine); out.scrollTop = out.scrollHeight; };
    const upd = () => prompt.textContent = `${S.userName.toLowerCase()}@windows12:/${cwd.join('/')}$`;
    const P = (...p) => [...cwd, ...p.filter(Boolean)];
    const resolve = a => {
      if (!a) return cwd.slice();
      if (a === '/' || a === '~') return [];
      let p = a.startsWith('/') ? [] : cwd.slice();
      a.replace(/^\//, '').split('/').filter(Boolean).forEach(s => {
        if (s === '.') return;
        if (s === '..') p.pop(); else p.push(s);
      });
      return p;
    };
    const hist = KV.get('term.hist', []); let hi = hist.length;

    const C = {};
    const def = (name, help, fn) => { C[name] = fn; fn.help = help; };

    def('help', 'список команд', a => {
      if (a && C[a]) return print(`${a} — ${C[a].help}`);
      const groups = {
        'Файлы':['ls','cd','pwd','cat','write','append','mkdir','rm','mv','cp','touch','tree','find','stat','du','head','tail','wc'],
        'Система':['ps','kill','open','sysinfo','neofetch','uptime','whoami','hostname','date','free','env'],
        'Оболочка':['theme','accent','glass','wall','volume','widget','notify','clear','history','echo','expr','exit']
      };
      print('<b class="inf">Доступные команды</b> (help &lt;команда&gt; — подробнее)');
      Object.entries(groups).forEach(([g, l]) => print(`  <b>${g}:</b> ${l.join(', ')}`));
    });

    def('ls', 'содержимое папки: ls [путь] [-l]', (a, raw) => {
      const long = /\s-l\b/.test(raw);
      const p = resolve((a && a !== '-l') ? a : '');
      const n = FS.node(p);
      if (!n || n.type !== 'dir') return print('ls: нет такой папки', 'er');
      const items = Object.values(n.children || {});
      if (!items.length) return print('(пусто)', 'muted');
      if (long) items.forEach(i => print(`${i.type === 'dir' ? 'd' : '-'}rw-r--r--  ${String(size(i)).padStart(8)}  ${new Date(i.mtime || 0).toLocaleDateString('ru-RU')}  ${i.type === 'dir' ? '<b class="inf">' + esc(i.name) + '</b>' : esc(i.name)}`));
      else print(items.map(i => i.type === 'dir' ? `<b class="inf">${esc(i.name)}/</b>` : esc(i.name)).join('   '));
    });
    def('cd', 'сменить папку: cd &lt;путь&gt;', a => {
      const p = resolve(a); const n = FS.node(p);
      if (!n || n.type !== 'dir') return print('cd: нет такой папки: ' + esc(a || ''), 'er');
      cwd = p; upd();
    });
    def('pwd', 'текущий путь', () => print('/' + cwd.join('/')));
    def('cat', 'показать файл', a => { const f = FS.node(resolve(a));
      f && f.type === 'file' ? print(esc(f.body || '(пусто)')) : print('cat: файл не найден', 'er'); });
    def('head', 'первые строки: head &lt;файл&gt; [n]', (a, raw) => lines(a, raw, true));
    def('tail', 'последние строки: tail &lt;файл&gt; [n]', (a, raw) => lines(a, raw, false));
    def('wc', 'счётчики строк/слов/символов', a => { const f = FS.node(resolve(a));
      if (!f || f.type !== 'file') return print('wc: файл не найден', 'er');
      const b = f.body || '';
      print(`${b.split('\n').length} строк  ${b.trim() ? b.trim().split(/\s+/).length : 0} слов  ${b.length} символов  ${esc(a)}`); });
    def('write', 'записать текст в файл: write &lt;файл&gt; &lt;текст&gt;', (a, raw) => {
      const i = raw.indexOf(' '); if (i < 0) return print('write &lt;файл&gt; &lt;текст&gt;', 'er');
      FS.write(cwd, raw.slice(0, i), raw.slice(i + 1)); print('Записано.', 'inf'); });
    def('append', 'дописать строку в конец файла', (a, raw) => {
      const i = raw.indexOf(' '); if (i < 0) return print('append &lt;файл&gt; &lt;текст&gt;', 'er');
      const name = raw.slice(0, i), f = FS.node([...cwd, name]);
      FS.write(cwd, name, ((f && f.body) || '') + (f && f.body ? '\n' : '') + raw.slice(i + 1)); print('Дописано.', 'inf'); });
    def('touch', 'создать пустой файл', a => { if (!a) return print('touch &lt;имя&gt;', 'er');
      FS.write(cwd, a, FS.node([...cwd, a]) ? FS.node([...cwd, a]).body : ''); print('OK', 'inf'); });
    def('mkdir', 'создать папку', a => FS.mkdir(cwd, a) ? print('OK', 'inf') : print('mkdir: не удалось', 'er'));
    def('rm', 'удалить (в корзину; -f — безвозвратно)', (a, raw) => {
      const f = /\s-f\b/.test(raw);
      FS.rm(cwd, a, f) ? print(f ? 'Удалено безвозвратно.' : 'Перемещено в корзину.', 'inf') : print('rm: не найдено', 'er');
      Shell.renderIcons(); });
    def('cp', 'копировать: cp &lt;что&gt; &lt;куда&gt;', (a, raw) => move(raw, false));
    def('mv', 'переместить/переименовать: mv &lt;что&gt; &lt;куда&gt;', (a, raw) => move(raw, true));
    def('tree', 'дерево папок', a => {
      const walk = (n, pre) => Object.values(n.children || {}).forEach((c, i, arr) => {
        const lastOne = i === arr.length - 1;
        print(pre + (lastOne ? '└── ' : '├── ') + (c.type === 'dir' ? `<b class="inf">${esc(c.name)}</b>` : esc(c.name)));
        if (c.type === 'dir') walk(c, pre + (lastOne ? '    ' : '│   '));
      });
      const n = FS.node(resolve(a)); if (!n) return print('tree: нет пути', 'er');
      print('/' + resolve(a).join('/')); walk(n, '');
    });
    def('find', 'поиск файлов по имени', a => {
      if (!a) return print('find &lt;подстрока&gt;', 'er');
      let k = 0;
      (function walk(n, p){ Object.values(n.children || {}).forEach(c => {
        if (c.name.toLowerCase().includes(a.toLowerCase())){ print('/' + [...p, c.name].join('/')); k++; }
        if (c.type === 'dir') walk(c, [...p, c.name]); }); })(FS.node(cwd), cwd);
      print(k ? `найдено: ${k}` : 'ничего не найдено', k ? 'inf' : 'muted');
    });
    def('stat', 'сведения о файле', a => { const f = FS.node(resolve(a));
      if (!f) return print('stat: не найдено', 'er');
      print(`  Имя:      ${esc(f.name)}\n  Тип:      ${f.type === 'dir' ? 'папка' : 'файл'}\n  Размер:   ${size(f)} Б\n  Создан:   ${new Date(f.ctime || 0).toLocaleString('ru-RU')}\n  Изменён:  ${new Date(f.mtime || 0).toLocaleString('ru-RU')}`); });
    def('du', 'размер папки', a => { const n = FS.node(resolve(a)); if (!n) return print('du: нет пути', 'er');
      print(`${(size(n) / 1024).toFixed(1)} КБ  /${resolve(a).join('/')}`); });

    def('ps', 'запущенные приложения', () => {
      print('  PID  ПРИЛОЖЕНИЕ            ОКНО');
      WM.wins.forEach((w, i) => print(`  ${String(1000 + i).padEnd(5)}${w.app.name.padEnd(22)}${esc(w.titleEl.textContent)}`));
      if (!WM.wins.length) print('  (нет запущенных приложений)', 'muted');
    });
    def('kill', 'закрыть окно: kill &lt;PID&gt;', a => {
      const w = WM.wins[+a - 1000];
      w ? (WM.close(w), print('Закрыто: ' + w.app.name, 'inf')) : print('kill: нет процесса ' + esc(a || ''), 'er'); });
    def('open', 'запустить приложение', a => APPS[a] ? (WM.open(a), print('Запуск ' + a, 'inf'))
      : print('open: нет приложения. Доступны: ' + Object.keys(APPS).join(', '), 'er'));
    def('sysinfo', 'сведения о системе', () => print(
      `  ОС:        Windows 12 Prototype (сборка 1200)\n  Ядро:      ${navigator.userAgent.includes('Firefox') ? 'Gecko' : 'Blink'}\n` +
      `  Экран:     ${screen.width}×${screen.height} @${devicePixelRatio}x\n  Ядер ЦП:   ${navigator.hardwareConcurrency || '?'}\n` +
      `  Память:    ${navigator.deviceMemory ? navigator.deviceMemory + ' ГБ' : 'н/д'}\n  Сеть:      ${navigator.onLine ? 'подключено' : 'нет сети'}\n` +
      `  Хранилище: ${(JSON.stringify(localStorage).length / 1024).toFixed(1)} КБ`));
    def('neofetch', 'логотип и сводка', () => print(`<span class="inf">   ▗▄▄▖▗▄▄▖ </span>  <b>${S.userName}@windows12</b>
<span class="inf">   ▝▀▀▘▝▀▀▘ </span>  ──────────────────
<span class="inf">   ▗▄▄▖▗▄▄▖ </span>  ОС:     Windows 12 Prototype
<span class="inf">   ▝▀▀▘▝▀▀▘ </span>  Тема:   ${S.theme} · акцент ${accentPair().a}
                  Стекло: ${S.blur}px / ${Math.round(S.glass * 100)}%
                  Окон:   ${WM.wins.length}`));
    def('uptime', 'время работы сессии', () => {
      const s = Math.round(performance.now() / 1000);
      print(`работает ${Math.floor(s / 3600)} ч ${Math.floor(s / 60) % 60} мин ${s % 60} с`); });
    def('whoami', 'текущий пользователь', () => print(S.userName));
    def('hostname', 'имя устройства', () => print('DYMENSITY-PC'));
    def('date', 'дата и время', () => print(new Date().toLocaleString('ru-RU')));
    def('free', 'использование хранилища', () => {
      const used = JSON.stringify(localStorage).length;
      print(`  localStorage: ${(used / 1024).toFixed(1)} КБ из ~5120 КБ (${(used / 51200).toFixed(1)}%)`); });
    def('env', 'переменные окружения', () => print(
      `  USER=${S.userName}\n  HOME=/\n  THEME=${S.theme}\n  CITY=${S.city}\n  LANG=${navigator.language}`));

    def('theme', 'тема: theme dark|light', a => ['dark','light'].includes(a)
      ? (Store.set('theme', a), print('Тема: ' + a, 'inf')) : print('theme dark|light', 'er'));
    def('accent', 'акцент: accent 0-9 или #hex', a => {
      if (/^#[0-9a-f]{6}$/i.test(a)){ S.accentCustom = a; Store.save(); applySettings(); return print('Акцент: ' + a, 'inf'); }
      const i = +a; if (!ACCENTS[i]) return print('accent 0-' + (ACCENTS.length - 1) + ' | #rrggbb\n' + ACCENTS.map((x, k) => `  ${k} ${x.n}`).join('\n'), 'er');
      S.accentCustom = null; Store.set('accent', i); print('Акцент: ' + ACCENTS[i].n, 'inf'); });
    def('glass', 'плотность стекла: glass 0-100', a => { const v = clamp(+a, 0, 100);
      Store.set('glass', v / 100); print('Стекло: ' + v + '%', 'inf'); });
    def('wall', 'обои: wall &lt;id|list&gt;', a => {
      if (!a || a === 'list') return print(WALLPAPERS.map(w => `  ${w.id.padEnd(9)}${w.name}`).join('\n'));
      WALLPAPERS.find(w => w.id === a) ? (Store.set('wallpaper', a), print('Обои: ' + a, 'inf')) : print('нет таких обоев', 'er'); });
    def('volume', 'громкость: volume 0-100', a => { const v = clamp(+a, 0, 100); Store.set('volume', v); print('Громкость: ' + v, 'inf'); });
    def('widget', 'виджет на стол: widget &lt;тип|list&gt;', a => {
      if (!a || a === 'list') return print(Object.entries(WIDGETS).map(([k, d]) => `  ${k.padEnd(10)}${d.n}`).join('\n'));
      WIDGETS[a] ? (addWidget(a), print('Добавлен виджет ' + a, 'inf')) : print('нет такого виджета', 'er'); });
    def('notify', 'показать уведомление', (a, raw) => { Shell.toast('Терминал', raw || 'Тест', '🔔'); print('OK', 'inf'); });
    def('echo', 'вывести текст', (a, raw) => print(esc(raw)));
    def('expr', 'вычислить выражение', (a, raw) => {
      try { print(String(Function('"use strict";return (' + raw.replace(/[^0-9+\-*/(). %]/g, '') + ')')())); }
      catch(e){ print('expr: не удалось вычислить', 'er'); } });
    def('history', 'история команд', () => hist.slice(-25).forEach((h, i) => print(`  ${i + 1}  ${esc(h)}`)));
    def('clear', 'очистить экран', () => $$('.term-line', out).forEach(n => n.remove()));
    def('exit', 'закрыть терминал', () => win.close());
    C.dir = C.ls; C.cls = C.clear; C.type = C.cat; C.del = C.rm; C.md = C.mkdir; C.cwd = C.pwd;

    function size(n){ return n.type === 'dir'
      ? Object.values(n.children || {}).reduce((s, c) => s + size(c), 0)
      : new Blob([n.body || '']).size + (n.img ? n.img.length : 0); }
    function lines(a, raw, head){
      const f = FS.node(resolve(a)); if (!f || f.type !== 'file') return print('файл не найден', 'er');
      const k = parseInt((raw.split(/\s+/)[1] || '10'), 10) || 10;
      const L = (f.body || '').split('\n');
      print(esc((head ? L.slice(0, k) : L.slice(-k)).join('\n')));
    }
    function move(raw, cut){
      const [src, dst] = raw.split(/\s+/);
      if (!src || !dst) return print('нужно: <что> <куда>', 'er');
      const node = FS.node(resolve(src));
      if (!node) return print('не найдено: ' + esc(src), 'er');
      const dstDir = FS.node(resolve(dst));
      if (dstDir && dstDir.type === 'dir'){
        FS.put(resolve(dst), JSON.parse(JSON.stringify(node)));
        if (cut) FS.rm(resolve(src).slice(0, -1), node.name, true);
      } else {                                   // переименование
        const p = resolve(src).slice(0, -1);
        if (cut) FS.rename(p, node.name, dst);
        else { const c = JSON.parse(JSON.stringify(node)); c.name = dst; FS.put(p, c); }
      }
      print(cut ? 'Перемещено.' : 'Скопировано.', 'inf'); Shell.renderIcons();
    }

    print('<b class="inf">Windows 12</b> [Версия 12.0.1200] — Терминал');
    print('Введите <b>help</b> для списка команд, Tab — автодополнение.\n');

    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        const line = inp.value; inp.value = '';
        print(`<span class="pr">${esc(prompt.textContent)}</span> ${esc(line)}`);
        if (line.trim()){
          hist.push(line); hi = hist.length; KV.set('term.hist', hist.slice(-100));
          const [c, ...rest] = line.trim().split(/\s+/);
          const fn = C[c.toLowerCase()];
          if (fn){ try { fn(rest[0], rest.join(' ')); } catch(err){ print(esc(c) + ': ' + esc(err.message), 'er'); } }
          else print(`${esc(c)}: команда не найдена. help — список команд.`, 'er');
        }
        out.scrollTop = out.scrollHeight;
      }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); if (hi > 0) inp.value = hist[--hi] || ''; }
      else if (e.key === 'ArrowDown'){ e.preventDefault(); hi = Math.min(hist.length, hi + 1); inp.value = hist[hi] || ''; }
      else if (e.key === 'Tab'){
        e.preventDefault();
        const parts = inp.value.split(/\s+/), w = parts[parts.length - 1] || '';
        const pool = parts.length <= 1 ? Object.keys(C)
          : Object.keys((FS.node(cwd) || {}).children || {});
        const hits = pool.filter(x => x.toLowerCase().startsWith(w.toLowerCase()));
        if (hits.length === 1){ parts[parts.length - 1] = hits[0]; inp.value = parts.join(' '); }
        else if (hits.length > 1) print(hits.join('   '), 'muted');
      }
      else if (e.key === 'l' && e.ctrlKey){ e.preventDefault(); C.clear(); }
    });
    out.onclick = () => { if (!getSelection().toString()) inp.focus(); };
    upd(); setTimeout(() => inp.focus(), 120);
  }
};

/* ==========================================================================
   4. Музыка: свои аудиофайлы + синтезатор
   ========================================================================== */
const SYNTH = [
  { t:'Liquid Dreams', a:'Синтезатор', scale:[0,3,5,7,10], root:220, bpm:96, e:'🌊', synth:true },
  { t:'Glass Horizon', a:'Синтезатор', scale:[0,2,4,7,9], root:261.6, bpm:112, e:'🪟', synth:true },
  { t:'Night Shift',   a:'Синтезатор', scale:[0,2,3,7,8], root:196, bpm:84, e:'🌙', synth:true }
];

APPS.music = {
  name:'Музыка', glyph:'🎵', bg:'linear-gradient(140deg,#fb7185,#a855f7)', w:560, h:660, single:true,
  render(win){
    let tracks = [...SYNTH], i = 0, playing = false, timer = null, step = 0, prog = 0, progTimer = null;
    const audio = new Audio(); audio.crossOrigin = 'anonymous';
    let srcNode = null, master = null, analyser = null;

    const wrap = el('div', 'app col'); win.body.appendChild(wrap);
    const mu = el('div', 'mu');
    const bar = el('div', 'toolbar');
    const list = el('div', 'scroll'); list.style.cssText = 'max-height:210px;padding:0 12px 12px';
    wrap.append(mu, bar, list);
    mu.innerHTML = `<div class="mu-art">🎵</div>
      <div style="text-align:center"><div class="mu-title"></div><div class="mu-artist"></div></div>
      <div class="mu-bar"><i></i></div><div class="mu-time tiny muted"></div>
      <div class="mu-ctl"><button data-a="prev">⏮</button><button class="pp" data-a="pp">▶</button><button data-a="next">⏭</button></div>
      <div class="mu-viz"></div>`;
    const viz = $('.mu-viz', mu);
    for (let k = 0; k < 40; k++) viz.appendChild(el('i'));
    const bars = $$('i', viz);

    const addBtn = el('button', 'btn pri', '➕ Добавить аудио');
    const volRow = slider(() => S.volume, v => { Store.set('volume', v); audio.volume = v / 100; }, 0, 100, 1, v => v + '%');
    bar.append(addBtn, el('span', 'tiny muted', 'Громкость'), volRow);
    addBtn.onclick = () => pickFiles();

    /* --- звуковой граф --- */
    const ensure = () => {
      const c = Snd.ac(); if (!c) return null;
      if (c.state === 'suspended') c.resume();
      if (!master){
        master = c.createGain(); master.gain.value = .18;
        analyser = c.createAnalyser(); analyser.fftSize = 128;
        master.connect(analyser); analyser.connect(c.destination);
      }
      if (!srcNode){
        try { srcNode = c.createMediaElementSource(audio); srcNode.connect(analyser); analyser.connect(c.destination); }
        catch(e){}
      }
      return c;
    };
    const note = (f, dur, type = 'triangle', g = .5) => {
      const c = ensure(); if (!c) return;
      const o = c.createOscillator(), gg = c.createGain();
      o.type = type; o.frequency.value = f;
      gg.gain.setValueAtTime(0, c.currentTime);
      gg.gain.linearRampToValueAtTime(g * (S.volume / 100), c.currentTime + .02);
      gg.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
      o.connect(gg).connect(master); o.start(); o.stop(c.currentTime + dur + .05);
    };
    const tick = () => {
      const tr = tracks[i]; if (!tr.synth) return;
      const deg = tr.scale[step % tr.scale.length], oct = Math.floor(step / tr.scale.length) % 3;
      note(tr.root * Math.pow(2, (deg + oct * 12) / 12), .55, 'triangle', .45);
      if (step % 4 === 0) note(tr.root / 2, .8, 'sine', .5);
      step++;
    };
    const drawViz = () => {
      if (analyser){
        const d = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(d);
        bars.forEach((b, k) => b.style.height = Math.max(5, (d[k % d.length] / 255) * 100) + '%');
      }
      if (win.node.isConnected) requestAnimationFrame(drawViz);
    };

    /* --- свои файлы --- */
    async function loadUserTracks(){
      const meta = KV.get('music.files', []);
      const loaded = [];
      for (const m of meta){
        const blob = await IDB.get(m.key);
        if (blob) loaded.push({ t:m.t, a:m.a || 'Мои файлы', e:'🎧', url:URL.createObjectURL(blob), key:m.key });
      }
      tracks = [...loaded, ...SYNTH];
      drawList();
    }
    function pickFiles(){
      const inp = el('input'); inp.type = 'file'; inp.accept = 'audio/*'; inp.multiple = true;
      inp.onchange = () => addFiles(inp.files);
      inp.click();
    }
    async function addFiles(files){
      const meta = KV.get('music.files', []);
      for (const f of [...files]){
        if (!/^audio\//.test(f.type) && !/\.(mp3|wav|ogg|m4a|flac)$/i.test(f.name)) continue;
        const key = 'audio.' + Date.now() + '.' + Math.random().toString(36).slice(2, 7);
        await IDB.put(key, f);
        meta.push({ key, t:f.name.replace(/\.[^.]+$/, ''), a:'Мои файлы' });
      }
      KV.set('music.files', meta);
      await loadUserTracks();
      Shell.toast('Музыка', 'Аудио добавлено в библиотеку', '🎧');
    }
    win.data.addFiles = addFiles;

    /* приём перетащенных аудио прямо в окно */
    win.node.addEventListener('drop', e => {
      if (!e.dataTransfer.files.length) return;
      e.preventDefault(); e.stopPropagation(); addFiles(e.dataTransfer.files);
    }, true);
    win.node.addEventListener('dragover', e => e.preventDefault(), true);

    /* --- воспроизведение --- */
    const fmtT = s => isFinite(s) ? `${Math.floor(s / 60)}:${pad2(Math.floor(s % 60))}` : '0:00';
    const load = () => {
      const tr = tracks[i]; if (!tr) return;
      $('.mu-title', mu).textContent = tr.t;
      $('.mu-artist', mu).textContent = tr.a;
      $('.mu-art', mu).textContent = tr.e;
      win.setTitle(tr.t + ' — Музыка');
      step = 0; prog = 0;
      if (!tr.synth){ audio.src = tr.url; audio.volume = S.volume / 100; }
      else { audio.pause(); audio.removeAttribute('src'); }
      drawList();
      Shell.nowPlaying = playing ? tr : null;
      Shell.updateCC && Shell.updateCC();
    };
    const play = v => {
      playing = v;
      const tr = tracks[i];
      $('[data-a="pp"]', mu).textContent = v ? '⏸' : '▶';
      $('.mu-art', mu).classList.toggle('play', v);
      clearInterval(timer); clearInterval(progTimer);
      if (v){
        ensure();
        if (tr.synth){
          tick(); timer = setInterval(tick, 60000 / tr.bpm / 2);
          progTimer = setInterval(() => { prog = (prog + .4) % 100;
            $('.mu-bar i', mu).style.width = prog + '%'; }, 120);
        } else {
          audio.play().catch(() => Shell.toast('Музыка', 'Не удалось воспроизвести файл', '⚠️'));
          progTimer = setInterval(() => {
            $('.mu-bar i', mu).style.width = (audio.currentTime / (audio.duration || 1) * 100) + '%';
            $('.mu-time', mu).textContent = `${fmtT(audio.currentTime)} / ${fmtT(audio.duration)}`;
          }, 200);
        }
      } else audio.pause();
      Shell.nowPlaying = v ? tr : null;
      Shell.updateCC && Shell.updateCC();
    };
    audio.onended = () => { i = (i + 1) % tracks.length; load(); play(true); };

    $('[data-a="pp"]', mu).onclick = () => play(!playing);
    $('[data-a="next"]', mu).onclick = () => { i = (i + 1) % tracks.length; load(); if (playing) play(true); };
    $('[data-a="prev"]', mu).onclick = () => { i = (i - 1 + tracks.length) % tracks.length; load(); if (playing) play(true); };
    $('.mu-bar', mu).onclick = e => {
      const r = e.currentTarget.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
      if (!tracks[i].synth && audio.duration) audio.currentTime = f * audio.duration;
      else { prog = f * 100; $('.mu-bar i', mu).style.width = prog + '%'; }
    };

    function drawList(){
      list.innerHTML = '';
      tracks.forEach((t, k) => {
        const n = el('div', 'td-item' + (k === i ? ' done' : ''));
        n.innerHTML = `<span style="font-size:17px">${t.e}</span>
          <div class="tx">${esc(t.t)}<br><small class="muted">${esc(t.a)}</small></div>`;
        if (t.key){
          const d = el('button', 'td-del', '×');
          d.onclick = async e => {
            e.stopPropagation();
            await IDB.del(t.key);
            KV.set('music.files', KV.get('music.files', []).filter(m => m.key !== t.key));
            if (k === i){ play(false); i = 0; }
            await loadUserTracks(); load();
          };
          n.appendChild(d);
        }
        n.onclick = e => { if (e.target.classList.contains('td-del')) return; i = k; load(); play(true); };
        list.appendChild(n);
      });
      const hint = el('div', 'tiny muted', 'Перетащите сюда аудиофайлы или нажмите «Добавить аудио»');
      hint.style.padding = '8px 4px';
      list.appendChild(hint);
    }

    win.onClose = () => { clearInterval(timer); clearInterval(progTimer); audio.pause(); Shell.nowPlaying = null; };
    loadUserTracks().then(() => { load(); });
    load(); drawViz();
  }
};

<script>
/* ==========================================================================
   Настоящие данные вместо выдуманных:
   сеть, батарея, хранилище, разрешения, устройства, дисплей, погода
   ========================================================================== */
'use strict';

const Real = {
  /* ---------- сеть ---------- */
  net(){
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return {
      online: navigator.onLine,
      type: c && c.effectiveType,          // 4g / 3g / 2g / slow-2g
      downlink: c && c.downlink,           // Мбит/с, оценка браузера
      rtt: c && c.rtt,                     // мс
      saveData: c && c.saveData,
      supported: !!c
    };
  },

  /* ---------- батарея ---------- */
  async battery(){
    if (!navigator.getBattery) return null;
    try {
      const b = await navigator.getBattery();
      return { level:Math.round(b.level * 100), charging:b.charging,
               timeLeft:b.dischargingTime, timeFull:b.chargingTime, raw:b };
    } catch(e){ return null; }
  },

  /* ---------- хранилище ---------- */
  async storage(){
    const ls = (() => { try { return JSON.stringify(localStorage).length; } catch(e){ return 0; } })();
    if (!navigator.storage || !navigator.storage.estimate) return { ls, quota:null, usage:null };
    try {
      const e = await navigator.storage.estimate();
      const persisted = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      return { ls, quota:e.quota, usage:e.usage, persisted };
    } catch(e){ return { ls, quota:null, usage:null }; }
  },
  async persist(){
    if (!navigator.storage || !navigator.storage.persist) return false;
    try { return await navigator.storage.persist(); } catch(e){ return false; }
  },

  /* ---------- разрешения ---------- */
  async perm(name){
    if (!navigator.permissions) return 'unknown';
    try { return (await navigator.permissions.query({ name })).state; }
    catch(e){ return 'unknown'; }
  },
  async askCamera(){
    try { const s = await navigator.mediaDevices.getUserMedia({ video:true });
      s.getTracks().forEach(t => t.stop()); return true; } catch(e){ return false; }
  },
  async askMic(){
    try { const s = await navigator.mediaDevices.getUserMedia({ audio:true });
      s.getTracks().forEach(t => t.stop()); return true; } catch(e){ return false; }
  },
  askGeo(){
    return new Promise(res => {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(
        p => res({ lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy }),
        () => res(null), { timeout:8000 });
    });
  },

  /* ---------- устройства ---------- */
  async media(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
    try { return await navigator.mediaDevices.enumerateDevices(); } catch(e){ return []; }
  },
  gamepads(){
    try { return [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean); }
    catch(e){ return []; }
  },
  input(){
    return {
      touch: navigator.maxTouchPoints > 0,
      points: navigator.maxTouchPoints || 0,
      fine: matchMedia('(pointer:fine)').matches,
      hover: matchMedia('(hover:hover)').matches,
      keyboard: true
    };
  },
  bluetooth(){ return { api: !!navigator.bluetooth, secure: isSecureContext }; },
  async btPick(){
    if (!navigator.bluetooth) return { error:'API недоступен' };
    try { const d = await navigator.bluetooth.requestDevice({ acceptAllDevices:true });
      return { name:d.name || 'без имени', id:d.id }; }
    catch(e){ return { error:e.name === 'NotFoundError' ? 'устройство не выбрано' : e.message }; }
  },

  /* ---------- дисплей ---------- */
  display(){
    return {
      w:screen.width, h:screen.height, aw:innerWidth, ah:innerHeight,
      dpr:devicePixelRatio || 1, depth:screen.colorDepth,
      orient:(screen.orientation && screen.orientation.type) || (innerWidth > innerHeight ? 'landscape' : 'portrait'),
      dark:matchMedia('(prefers-color-scheme: dark)').matches,
      reduce:matchMedia('(prefers-reduced-motion: reduce)').matches,
      contrast:matchMedia('(prefers-contrast: more)').matches,
      hdr:matchMedia('(dynamic-range: high)').matches
    };
  },
  refreshRate(){
    return new Promise(res => {
      let n = 0; const t0 = performance.now();
      const tick = () => { n++;
        if (performance.now() - t0 < 500) requestAnimationFrame(tick);
        else res(Math.round(n / ((performance.now() - t0) / 1000)));
      };
      requestAnimationFrame(tick);
    });
  },

  /* ---------- система ---------- */
  system(){
    const ua = navigator.userAgentData;
    return {
      cores:navigator.hardwareConcurrency || null,
      mem:navigator.deviceMemory || null,
      platform:(ua && ua.platform) || navigator.platform || 'н/д',
      mobile:(ua && ua.mobile) || /Mobi|Android/i.test(navigator.userAgent),
      engine:navigator.userAgent.includes('Firefox') ? 'Gecko'
        : (navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome')) ? 'WebKit' : 'Blink',
      lang:navigator.language, langs:navigator.languages,
      tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
      secure:isSecureContext, cookies:navigator.cookieEnabled
    };
  }
};
window.Real = Real;

/* ==========================================================================
   Погода: настоящий прогноз через Open-Meteo, если есть сеть
   ========================================================================== */
const Weather = {
  key:'weather.cache',
  busy:false,
  data(){ return KV.get(this.key, null); },
  fresh(){ const d = this.data(); return d && Date.now() - d.ts < 3600000 && d.city === S.city; },

  async load(force){
    if (this.busy || (!force && this.fresh())) return this.data();
    if (!navigator.onLine) return this.data();
    this.busy = true;
    try {
      const g = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&name='
        + encodeURIComponent(S.city)).then(r => r.json());
      const place = g.results && g.results[0];
      if (!place) throw new Error('город не найден');
      const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}` +
        `&longitude=${place.longitude}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`).then(r => r.json());
      const d = {
        ts:Date.now(), city:S.city, real:true,
        name:place.name + (place.admin1 ? ', ' + place.admin1 : ''),
        t:Math.round(w.current.temperature_2m),
        code:w.current.weather_code,
        hum:w.current.relative_humidity_2m,
        wind:w.current.wind_speed_10m,
        days:w.daily.time.slice(1, 6).map((dt, i) => ({
          d:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][new Date(dt).getDay()],
          code:w.daily.weather_code[i + 1],
          max:Math.round(w.daily.temperature_2m_max[i + 1]),
          min:Math.round(w.daily.temperature_2m_min[i + 1])
        }))
      };
      KV.set(this.key, d);
      Shell.renderDeskWidgets && Shell.renderDeskWidgets();
      Shell.renderWidgets && Shell.renderWidgets();
      Shell.clock && Shell.clock();
      return d;
    } catch(e){
      KV.set('weather.error', String(e.message || e));
      return this.data();
    } finally { this.busy = false; }
  },

  /* коды WMO → значок и описание */
  icon(c){
    if (c === 0) return '☀️'; if (c <= 2) return '🌤'; if (c === 3) return '☁️';
    if (c <= 48) return '🌫'; if (c <= 57) return '🌦'; if (c <= 67) return '🌧';
    if (c <= 77) return '❄️'; if (c <= 82) return '🌧'; if (c <= 86) return '🌨';
    return '⛈';
  },
  desc(c){
    if (c === 0) return 'Ясно'; if (c <= 2) return 'Малооблачно'; if (c === 3) return 'Пасмурно';
    if (c <= 48) return 'Туман'; if (c <= 57) return 'Морось'; if (c <= 67) return 'Дождь';
    if (c <= 77) return 'Снег'; if (c <= 82) return 'Ливень'; if (c <= 86) return 'Снегопад';
    return 'Гроза';
  }
};
window.Weather = Weather;

/* подменяем демо-погоду настоящей, если она загрузилась */
(function patchWeather(){
  const demo = Shell.weather.bind(Shell);
  Shell.weather = function(){
    const d = Weather.data();
    if (d && d.real && d.city === S.city){
      return { t:d.t, ico:Weather.icon(d.code), desc:Weather.desc(d.code), real:true, hum:d.hum, wind:d.wind,
        days:d.days.map(x => ({ d:x.d, i:Weather.icon(x.code), t:x.max })) };
    }
    const w = demo(); w.real = false; return w;
  };
  Weather.load();
  addEventListener('online', () => Weather.load(true));
  setInterval(() => Weather.load(), 900000);
})();

const CATALOG = [

/* ---------- Помидор ---------- */
{ id:'pomodoro', name:'Помидор', glyph:'🍅', bg:'linear-gradient(140deg,#fb7185,#dc2626)',

/* ---------- 2048 ---------- */
{ id:'g2048', name:'2048', glyph:'🎲', bg:'linear-gradient(140deg,#fbbf24,#f97316)',
  w:460, h:560, author:'Dymensity', desc:'Классическая головоломка со счётом и рекордом',
  render(win){
    const wrap = el('div', 'app col'); wrap.style.cssText = 'padding:16px;gap:12px';
    win.body.appendChild(wrap);
    const head = el('div', 'row');
    const score = el('div', 'g-score', 'Счёт<b>0</b>');
    const best = el('div', 'g-score', 'Рекорд<b>' + KV.get('g2048.best', 0) + '</b>');
    const again = el('button', 'btn', 'Заново');
    head.append(score, best, el('div', 'grow'), again);
    const board = el('div', 'g-board');
    const hint = el('div', 'tiny muted', 'Стрелки или WASD · свайп на сенсорном экране');
    wrap.append(head, board, hint);

    let g, sc;
    const rnd = () => {
      const free = [];
      g.forEach((r, y) => r.forEach((v, x) => { if (!v) free.push([x, y]); }));
      if (!free.length) return;
      const [x, y] = free[Math.floor(Math.random() * free.length)];
      g[y][x] = Math.random() < .9 ? 2 : 4;
    };
    const start = () => { g = [0,1,2,3].map(() => [0,0,0,0]); sc = 0; rnd(); rnd(); paint(); };
    const paint = () => {
      board.innerHTML = '';
      g.forEach(r => r.forEach(v => {
        const c = el('div', 'g-cell' + (v ? ' v' + Math.min(v, 2048) : ''), v || '');
        board.appendChild(c);
      }));
      $('b', score).textContent = sc;
      const b = Math.max(sc, KV.get('g2048.best', 0));
      KV.set('g2048.best', b); $('b', best).textContent = b;
    };
    const slide = row => {
      const a = row.filter(Boolean);
      for (let i = 0; i < a.length - 1; i++)
        if (a[i] === a[i + 1]){ a[i] *= 2; sc += a[i]; a.splice(i + 1, 1); }
      while (a.length < 4) a.push(0);
      return a;
    };
    const move = dir => {
      const before = JSON.stringify(g);
      const rot = n => { for (let k = 0; k < n; k++) g = g[0].map((_, i) => g.map(r => r[i]).reverse()); };
      const back = { left:0, up:3, right:2, down:1 }[dir];
      rot({ left:0, up:1, right:2, down:3 }[dir]);
      g = g.map(slide);
      rot(back);
      if (JSON.stringify(g) !== before){ rnd(); paint(); check(); }
    };
    const check = () => {
      const full = g.every(r => r.every(Boolean));
      const stuck = full && g.every((r, y) => r.every((v, x) =>
        (x < 3 && v === g[y][x + 1]) === false && (y < 3 && v === g[y + 1][x]) === false));
      if (stuck) setTimeout(() => Shell.toast('2048', 'Игра окончена · счёт ' + sc, '🎲'), 200);
    };
    again.onclick = start;
    win.node.tabIndex = 0;
    win.node.addEventListener('keydown', e => {
      const m = { ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
                  a:'left', d:'right', w:'up', s:'down', ф:'left', в:'right', ц:'up', ы:'down' };
      const d = m[e.key] || m[e.key.toLowerCase()];
      if (d){ e.preventDefault(); move(d); }
    });
    let tx = 0, ty = 0;
    board.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
    board.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    });
    setTimeout(() => win.node.focus(), 100);
    start();
  }
},

        n.appendChild(el('span', '', h));
        n.onclick = () => {
          if (navigator.clipboard) navigator.clipboard.writeText(h).catch(() => {});
          Shell.toast('Палитра', h + ' скопирован', '🎨', 1800);
        };
        grid.appendChild(n);
      });
    };
    gen.onclick = make;
    acc.onclick = () => { S.accentCustom = hex(colors[3]); Store.save(); applySettings();
      Shell.toast('Палитра', 'Акцент системы обновлён', '🎯'); };
    make();
  }
}
];

/* ==========================================================================
   Установка и удаление
   ========================================================================== */
const AppStore = {
  installedKey:'store.installed',
  customKey:'store.custom',

  installedIds(){ return KV.get(this.installedKey, []); },
  custom(){ return KV.get(this.customKey, []); },

  /* регистрация всего установленного при запуске */
  boot(){
    this.installedIds().forEach(id => {
      const a = CATALOG.find(x => x.id === id);
      if (a) APPS[id] = a;
    });
    this.custom().forEach(p => this.register(p));
  },

  /* пользовательское приложение из пакета */
  register(pkg){
    try {
      const fn = new Function('win', 'api', pkg.code);
      APPS[pkg.id] = {
        name:pkg.name, glyph:pkg.glyph || '📦',
        bg:pkg.bg || 'linear-gradient(140deg,#94a3b8,#475569)',
        w:pkg.w || 640, h:pkg.h || 460, custom:true, pkg,
        render(win){
          try { fn(win, { el, $, $$, KV, FS, Shell, WM, S, esc, pad2, clamp }); }
          catch(e){ win.body.innerHTML = `<div class="pad">Ошибка приложения:<br><b>${esc(e.message)}</b></div>`; }
        }
      };
      return true;
    } catch(e){
      Shell.toast('Магазин', 'Пакет содержит ошибку: ' + e.message, '⚠️');
      return false;
    }
  },

  install(id){
    const a = CATALOG.find(x => x.id === id); if (!a) return false;
    const list = this.installedIds();
    if (!list.includes(id)){ list.push(id); KV.set(this.installedKey, list); }
    APPS[id] = a;
    if (!S.pinned.includes(id)){ S.pinned.push(id); Store.save(); }
    Shell.renderStart();
    Shell.toast('Магазин', a.name + ' установлено', a.glyph);
    return true;
  },

  installPkg(pkg){
    if (!pkg || !pkg.id || !pkg.name || !pkg.code) { Shell.toast('Магазин', 'Это не пакет приложения', '⚠️'); return false; }
    if (APPS[pkg.id] && !this.custom().some(p => p.id === pkg.id)){
      Shell.toast('Магазин', 'Идентификатор занят системным приложением', '⚠️'); return false;
    }
    if (!this.register(pkg)) return false;
    const list = this.custom().filter(p => p.id !== pkg.id);
    list.push(pkg); KV.set(this.customKey, list);
    if (!S.pinned.includes(pkg.id)){ S.pinned.push(pkg.id); Store.save(); }
    Shell.renderStart();
    Shell.toast('Магазин', pkg.name + ' установлено', pkg.glyph || '📦');
    return true;
  },

  uninstall(id){
    const open = WM.wins.filter(w => w.appId === id);
    open.forEach(w => WM.close(w));
    // окно закрывается с анимацией — снимаем регистрацию после неё
    setTimeout(() => { delete APPS[id]; Shell.renderDock(); }, open.length ? 320 : 0);
    delete APPS[id];
    KV.set(this.installedKey, this.installedIds().filter(x => x !== id));
    KV.set(this.customKey, this.custom().filter(p => p.id !== id));
    S.pinned = S.pinned.filter(x => x !== id);
    S.dockApps = S.dockApps.filter(x => x !== id);
    Store.save();
    Shell.renderStart(); Shell.renderDock();
    Shell.toast('Магазин', 'Приложение удалено', '🗑️');
  },

  isInstalled(id){ return !!APPS[id]; },

  /* шаблон пакета для своих приложений */
  template(){
    return {
      id:'my-app', name:'Моё приложение', glyph:'✨',
      bg:'linear-gradient(140deg,#f472b6,#8b5cf6)', w:520, h:400,
      code:[
        "// win  — окно: win.body, win.setTitle(), win.setSub(), win.close()",
        "// api  — { el, $, $$, KV, FS, Shell, WM, S }",
        "const box = api.el('div', 'pad');",
        "box.innerHTML = '<h2>Привет!</h2><p class=\"muted\">Это приложение установлено из пакета.</p>';",
        "const b = api.el('button', 'btn pri', 'Нажми меня');",
        "let n = 0;",
        "b.onclick = () => { n++; b.textContent = 'Нажато ' + n; api.Shell.toast('Моё приложение', 'Клик №' + n, '✨'); };",
        "box.appendChild(b);",
        "win.body.appendChild(box);"
      ].join('\n')
    };
  }
};
window.AppStore = AppStore;
AppStore.boot();

/* ==========================================================================
   Витрина магазина
   ========================================================================== */
APPS.store = {
  name:'Магазин', glyph:'🛍️', bg:'linear-gradient(140deg,#c4b5fd,#7c3aed)', w:880, h:640, single:true,
  render(win){
    const wrap = el('div', 'app col'); win.body.appendChild(wrap);
    const bar = el('div', 'toolbar');
    const body = el('div', 'scroll pad');
    wrap.append(bar, body);
    let tab = 'catalog';

    [['catalog','🛍 Каталог'],['mine','📦 Установленные'],['dev','🧑‍💻 Своё приложение']].forEach(([k, n]) => {
      const b = el('button', 'btn' + (k === tab ? ' pri' : ''), n);
      b.onclick = () => { tab = k; $$('.btn', bar).forEach(x => x.classList.remove('pri')); b.classList.add('pri'); draw(); };
      bar.appendChild(b);
    });

    function cardFor(a, installed, custom){
      const c = el('div', 'st-card');
      const ico = el('div', 'app-ico', a.glyph); ico.style.background = a.bg;
      ico.style.width = ico.style.height = '54px'; ico.style.fontSize = '26px';
      c.appendChild(ico);
      c.appendChild(el('div', '', `<b style="font-size:13px">${esc(a.name)}</b>
        <div class="tiny muted" style="margin-top:3px;line-height:1.35">${esc(a.desc || (custom ? 'Своё приложение' : 'Системное приложение'))}</div>
        <div class="tiny muted" style="margin-top:4px;opacity:.5">${esc(a.author || 'вы')}</div>`));
      const row2 = el('div', 'row');
      if (installed){
        const open = el('button', 'btn pri', 'Открыть');
        open.onclick = () => WM.open(a.id);
        row2.appendChild(open);
        if (a.removable !== false){
          const del = el('button', 'btn', '🗑');
          del.onclick = () => { if (confirm('Удалить «' + a.name + '»?')) { AppStore.uninstall(a.id); draw(); } };
          row2.appendChild(del);
        }
      } else {
        const ins = el('button', 'btn pri', '⬇ Установить');
        ins.onclick = () => { AppStore.install(a.id); draw(); };
        row2.appendChild(ins);
      }
      c.appendChild(row2);
      return c;
    }

    function draw(){
      body.innerHTML = '';
      if (tab === 'catalog'){
        body.appendChild(el('div', 'st-hero', `<h2 style="margin:0 0 6px">Магазин Dymensity</h2>
          <div style="opacity:.85">Приложения устанавливаются по-настоящему: появляются в Пуске,
          запускаются как системные и удаляются вместе с данными</div>`));
        body.appendChild(el('div', 'card-t', 'Доступно к установке'));
        const g = el('div', 'st-grid');
        CATALOG.forEach(a => g.appendChild(cardFor(a, AppStore.isInstalled(a.id))));
        body.appendChild(g);
        win.setSub('каталог · ' + CATALOG.length);
      }
      else if (tab === 'mine'){
        const custom = AppStore.custom();
        const installed = AppStore.installedIds().map(id => CATALOG.find(x => x.id === id)).filter(Boolean);
        body.appendChild(el('div', 'card-t', 'Установлено из каталога'));
        const g1 = el('div', 'st-grid');
        installed.forEach(a => g1.appendChild(cardFor(a, true)));
        if (!installed.length) g1.appendChild(el('div', 'empty', 'Пока ничего не установлено'));
        body.appendChild(g1);

        body.appendChild(el('div', 'card-t', 'Свои приложения'));
        const g2 = el('div', 'st-grid');
        custom.forEach(p => g2.appendChild(cardFor(
          { id:p.id, name:p.name, glyph:p.glyph || '📦', bg:p.bg || 'linear-gradient(140deg,#94a3b8,#475569)',
            desc:'Установлено из пакета', author:'вы' }, true, true)));
        if (!custom.length) g2.appendChild(el('div', 'empty', 'Своих приложений нет'));
        body.appendChild(g2);

        body.appendChild(el('div', 'card-t', 'Системные (удалить нельзя)'));
        const g3 = el('div', 'st-grid');
        Object.entries(APPS).filter(([id, a]) => !a.custom && !CATALOG.some(c => c.id === id))
          .forEach(([id, a]) => g3.appendChild(cardFor({ ...a, id, removable:false }, true)));
        body.appendChild(g3);
        win.setSub('установлено · ' + (installed.length + custom.length));
      }
      else {
        body.appendChild(el('div', 'card-t', 'Своё приложение'));
        const c = card('');
        c.appendChild(row('📄', 'Что такое пакет',
          'Обычный .json-файл: идентификатор, имя, значок, размеры окна и код на JavaScript в поле code. ' +
          'Код получает объект окна и набор функций системы.', el('span')));

        const tpl = el('button', 'btn pri', '✨ Создать заготовку');
        tpl.onclick = () => {
          const p = AppStore.template();
          const name = p.id + '.app.json';
          FS.write(['Документы'], name, JSON.stringify(p, null, 2));
          WM.open('notepad', { file:{ name, path:['Документы'], body:JSON.stringify(p, null, 2) } });
          Shell.toast('Магазин', 'Заготовка в Документы/' + name, '✨');
        };
        c.appendChild(row('🧩', 'Заготовка в Блокноте', 'Создаст рабочий пример и откроет его для правки', tpl));

        const fromFs = el('button', 'btn', '📂 Из файлов');
        fromFs.onclick = () => WM.open('files', { path:['Документы'], pick:f => {
          try { AppStore.installPkg(JSON.parse(f.body)); tab = 'mine'; draw(); WM.focus(win); }
          catch(e){ Shell.toast('Магазин', 'Не разобрать JSON: ' + e.message, '⚠️'); }
        }});
        c.appendChild(row('💾', 'Установить из системы', 'Выберите .json-пакет в Проводнике', fromFs));

        const fromDisk = el('button', 'btn', '⬆️ С компьютера');
        fromDisk.onclick = () => {
          const f = el('input'); f.type = 'file'; f.accept = '.json,application/json';
          f.onchange = () => {
            const r = new FileReader();
            r.onload = () => { try { AppStore.installPkg(JSON.parse(r.result)); tab = 'mine'; draw(); }
              catch(e){ Shell.toast('Магазин', 'Не разобрать JSON: ' + e.message, '⚠️'); } };
            r.readAsText(f.files[0]);
          };
          f.click();
        };
        c.appendChild(row('🖥', 'Установить с диска', 'Настоящий файл с вашего компьютера', fromDisk));
        body.appendChild(c);

        const w = card('Как это работает');
        w.appendChild(row('⚙️', 'Код выполняется в системе',
          'Пакет исполняется как обычное приложение прототипа: у него есть доступ к окну, файловой системе и уведомлениям. ' +
          'Ставьте только те пакеты, содержимое которых вы видели — это ваш код в вашем браузере.', el('span')));
        const ex = el('pre', 'pkg-code', esc(JSON.stringify(AppStore.template(), null, 2)).slice(0, 900));
        w.appendChild(ex);
        body.appendChild(w);
        win.setSub('разработка');
      }
    }
    draw();
  }
};

</script>
