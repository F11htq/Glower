<meta charset="utf-8">
<title>Панель GlowerOS</title>
<link rel="stylesheet" href="css/панель.css">

<!-- ==========================================================================
     Панель — отдельная страница, и это главное в ней.

     Раньше панель открывала ту же страницу, что и рабочий стол, и прятала у
     себя всё лишнее: обои, значки, окна, мастер настройки, экран входа,
     заставку, приветствие, занавес выключения. Список этот вёлся руками и
     отставал каждый раз: шесть поломок подряд выросли из одного — что-то
     занимающее весь экран оказывалось нарисованным внутри полосы высотой в
     семьдесят пикселей.

     Здесь прятать нечего. В этой странице нет ни рабочего стола, ни мастера,
     ни заставки — их сюда просто не из чего взять. Целый класс ошибок
     исчезает не заплаткой, а тем, что ему негде появиться.

     Так устроены панели настоящих систем: отдельная маленькая программа,
     которая про рабочий стол ничего не знает и разговаривает с ним через
     общую шину.
     ========================================================================== -->

<div class="полоса" id="полоса">
  <button class="кнопка меню-программ" id="программы">
    <svg viewBox="0 0 24 24" class="зн"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Программы</span>
  </button>

  <div class="середина">
    <button class="кнопка часы" id="часы">
      <span id="время">00:00</span>
      <span class="дата" id="дата">1 января</span>
    </button>
  </div>

  <div class="указатели" id="указатели">
    <div class="лоток" id="лоток"></div>
    <button class="кнопка" id="язык" data-подсказка="Раскладка">ENG</button>
    <button class="кнопка" id="звук" data-подсказка="Звук и яркость">
      <svg viewBox="0 0 24 24" class="зн"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button class="кнопка" id="батарея" data-подсказка="Батарея">
      <svg viewBox="0 0 24 24" class="зн"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M21.5 11v2"/><rect class="залив" x="4.5" y="9.5" width="10" height="5" rx="1"/></svg>
    </button>
    <button class="кнопка" id="питание" data-подсказка="Завершение работы">
      <svg viewBox="0 0 24 24" class="зн"><path d="M12 3v9"/><path d="M6.5 6.5a8 8 0 1 0 11 0"/></svg>
    </button>
  </div>
</div>

<div class="навес" id="навес"></div>

<script src="js/панель.js"></script>
