# GlowerOS: настройки ядра для игр — те же, что Valve ставит в SteamOS
#
# Защита от «split lock» искусственно тормозит программу, которая делает
# такую операцию (её делают многие игры Windows): ядро усыпляет её на 10 мс
# за каждую. Windows так не делает — игры там идут без этих провалов.
kernel.split_lock_mitigate = 0
# Игры под Proton и некоторые родные просят много областей памяти: без
# этого часть из них падает при загрузке уровня
vm.max_map_count = 2147483642
