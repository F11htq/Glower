# ==========================================================================
#  Настройки терминала для всей системы (/etc/xdg/foot/foot.ini).
#
#  Главное здесь — одна строчка: Ctrl+V вставляет.
#
#  В foot вставка по умолчанию висит на Ctrl+Shift+V: Ctrl+V в терминалах
#  исторически занят оболочкой под «следующий символ понимать буквально».
#  Человеку, пришедшему из Windows, это не объяснить — он жмёт Ctrl+V,
#  ничего не появляется, и длинную команду он переписывает руками, делая
#  по три опечатки. Наш пользователь так и сделал и справедливо сказал,
#  что больше не будет.
#
#  Цена размена: в bash перестанет работать Ctrl+V как буквальный ввод
#  следующего символа. Им пользуются единицы, вставкой — все.
#  Ctrl+Shift+V оставлен тоже: в чужих руководствах пишут именно его.
# ==========================================================================

font=monospace:size=11
pad=8x8
# Выделил мышью — уже в буфере обмена, отдельно копировать не нужно.
selection-target=both

[cursor]
style=beam
blink=yes

[colors]
alpha=0.96
background=141620
foreground=d8dbe6

[key-bindings]
clipboard-paste=Control+v Control+Shift+v XF86Paste
clipboard-copy=Control+Shift+c XF86Copy

[search-bindings]
# Тот же Ctrl+V и в строке поиска по выводу: иначе он там перестанет
# работать вовсе, и разница будет необъяснимой.
clipboard-paste=Control+v Control+Shift+v XF86Paste

# Верхняя строка окна — как у всех программ системы: тёмная, 34 точки,
# кнопки по 46 точек справа. Свою строку foot рисует сам (оконный сервер
# оставляет это программам), и без этих строк она выходила светлой,
# мелкой и совсем не похожей на соседние окна.
[csd]
size=34
font=sans-serif:size=9.5:weight=bold
color=ff12141b
button-width=46
button-color=ffe8eaf2
button-minimize-color=ff12141b
button-maximize-color=ff12141b
button-close-color=ff12141b
border-width=0
