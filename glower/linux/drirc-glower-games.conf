<?xml version="1.0" standalone="yes"?>
<!--
  GlowerOS: OpenGL в отдельном потоке (glthread) для игр, которые упираются
  в процессор. Minecraft на Java — главный: драйвер разбирает его вызовы в
  своём потоке, и игра не ждёт, — кадров заметно больше.
-->
<driconf>
  <device>
    <application name="Minecraft (Java)" executable="java">
      <option name="mesa_glthread" value="true"/>
    </application>
    <application name="CS:GO" executable="csgo_linux64">
      <option name="mesa_glthread" value="true"/>
    </application>
  </device>
</driconf>
