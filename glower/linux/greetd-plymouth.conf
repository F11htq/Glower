# GlowerOS: заставка загрузки держится до экрана входа, без чёрного экрана
# между ними — так же устроен экран входа GNOME (gdm.service). Обычно
# заставку гасит отдельная служба plymouth-quit, как только загрузка
# дошла до конца, — и до экрана входа на мониторе пусто. Здесь её гасит
# сама служба входа, перед тем как взять экран, и последний кадр заставки
# остаётся на мониторе (--retain-splash), пока экран входа не нарисуется.
[Unit]
Conflicts=plymouth-quit.service
After=plymouth-quit.service plymouth-start.service
OnFailure=plymouth-quit.service

[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
