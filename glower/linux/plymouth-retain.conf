# GlowerOS: заставка загрузки гаснет, но её последний кадр остаётся на
# мониторе, пока экран входа не нарисуется, — без чёрного экрана между
# ними. Меняем только то, как штатная служба гасит заставку: порядок
# загрузки не трогаем. (В v11.78 вместо этого служба входа сама гасила
# заставку, а служба plymouth-quit была запрещена, — но greetd ждёт
# plymouth-quit-wait, и загрузка вставала на логотипе навсегда.)
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
