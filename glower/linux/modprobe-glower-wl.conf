# Закрытый драйвер Broadcom (wl) стоит в GlowerOS ради старых ноутбуков с
# картами Broadcom. Сам по себе udev загружает его на любой машине, и ядро
# пишет в журнал сбой («Unpatched return thunk in use»): модуль собран без
# защит, которых ждёт новое ядро. Загружаем его только там, где есть
# устройство Broadcom (код производителя 14e4).
install wl /bin/sh -c 'if grep -qsx 0x14e4 /sys/bus/pci/devices/*/vendor; then exec /sbin/modprobe --ignore-install wl $CMDLINE_OPTS; fi'
