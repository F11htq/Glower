; GlowerOS: игровой режим (Feral gamemode). Включает его панель сама, когда
; видит игру. Процессор — на полную частоту (так он делает и без этого
; файла), а здесь ещё приоритет игры выше остальных программ.
[general]
renice=10
softrealtime=auto
inhibit_screensaver=1

[gpu]
; встроенная Intel/AMD — тоже на полную частоту, пока идёт игра
igpu_desiredgov=performance
