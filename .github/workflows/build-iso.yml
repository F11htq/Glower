# ==========================================================================
#  Сборка загрузочного образа GlowerOS силами GitHub
#
#  Запускается вручную (вкладка Actions → Build ISO → Run workflow) или по
#  метке версии вида v1.0. Готовый образ появляется в разделе Releases —
#  обычной ссылкой, без разрезания на части.
# ==========================================================================
name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    # Сборка идёт долго: выкачать основу, поставить сотни пакетов, сжать всё
    # в squashfs с самым плотным сжатием. Полутора часов однажды не хватило —
    # работу оборвали на первом же шаге, и по журналу это выглядело ошибкой,
    # хотя ошибки не было. Даём запас, чтобы обрыв означал настоящую беду.
    timeout-minutes: 150

    steps:
      # С метками и всей историей: по ним образ узнаёт свою версию и пишет
      # её себе в /etc/glower-release и в «О системе». Обычная выкачка берёт
      # один коммит без меток — и версия вышла бы безымянной ровно там, где
      # она и нужна.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Проверка дешёвая, а ловит то, чего не ловит ни один разбор:
      # комментарий внутри склеенной команды и кириллицу в именах
      # переменных. И то и другое молчит до самого запуска, а тут запуск —
      # это полуторачасовая сборка образа.
      - name: Проверить скрипты
        # Без имён она находит скрипты сама, по первой строке файла. Список
        # руками вести нельзя — он отстаёт молча: в прежнем не было ни
        # glower-shot, ни glower-install, ни половины остальных.
        run: sh glower/test/склейки.sh

      - name: Инструменты сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      # Зеркало задаём здесь, а не оставляем на усмотрение рецепта.
      #
      # Две сборки подряд встали на одном и том же пакете — debianutils — и
      # дальше не пошли: первую оборвали по времени на девяностой минуте,
      # вторая простояла тридцать четыре и стояла бы дальше. Качали с
      # archive.ubuntu.com: машина сборки сама на него настроена, и рецепт,
      # спросив её, брал тот же адрес. Виснет именно он.
      #
      # Машины GitHub стоят в облаке Azure, и у них есть своё зеркало под
      # боком. Берём его, а общедоступное оставляем запасным — и печатаем
      # выбор, чтобы в следующий раз не гадать по журналу.
      - name: Выбрать зеркало
        run: |
          for m in http://azure.archive.ubuntu.com/ubuntu \
                   http://archive.ubuntu.com/ubuntu; do
            if curl -fsS --max-time 20 -o /dev/null "$m/dists/noble/Release"; then
              echo "зеркало сборки: $m"
              echo "MIRROR=$m" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "зеркало $m не отвечает — пробую следующее"
          done
          echo "ни одно зеркало не ответило" >&2
          exit 1

      - name: Собрать образ
        env:
          MIRROR: ${{ env.MIRROR }}
        run: sudo -E bash glower/linux/mkiso.sh --out glower.iso

      - name: Контрольная сумма
        run: sha256sum glower.iso > glower.iso.sha256

      - name: Выложить как artifact
        uses: actions/upload-artifact@v4
        with:
          name: glower-iso
          path: |
            glower.iso
            glower.iso.sha256
          retention-days: 14

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glower.iso
            glower.iso.sha256
            glower_*_all.deb

      # ------------------------------------------------------------------
      # Репозиторий обновлений.
      #
      # Пакет с нашими файлами едет в отдельную ветку apt, а она отдаётся
      # обычным https через raw.githubusercontent.com. Ничего, кроме
      # GitHub, для этого не нужно: ни своего сервера, ни включённых
      # Pages, ни ключей.
      #
      # Ветка живёт сама по себе, без истории кода: в ней только пакеты и
      # два служебных файла, которые apt читает, чтобы узнать, что где
      # лежит. Старые пакеты не удаляем — по ним человек сможет вернуться
      # на прежнюю версию, если новая ему не понравится.
      - name: Обновить репозиторий пакетов
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils
          git config user.name  "Сборка GlowerOS"
          git config user.email "noreply@glower.local"

          # Ветка может и не существовать — тогда заводим её пустой.
          if git ls-remote --exit-code --heads origin apt >/dev/null 2>&1; then
            git fetch origin apt
            git worktree add /tmp/apt origin/apt
          else
            git worktree add --detach /tmp/apt
            git -C /tmp/apt checkout --orphan apt
            git -C /tmp/apt rm -rf . >/dev/null 2>&1 || true
          fi

          cp glower_*_all.deb /tmp/apt/

          # Packages — список пакетов с их размерами и суммами, Release —
          # опись самого списка. Обе вещи apt читает при каждом «обновить».
          ( cd /tmp/apt && dpkg-scanpackages --multiversion . > Packages )
          gzip -9kf /tmp/apt/Packages
          ( cd /tmp/apt && apt-ftparchive release . > Release )

          cat > /tmp/apt/README.md <<'ЧИТАЙ'
          # Репозиторий обновлений GlowerOS

          Эта ветка — не код, а склад пакетов. Её читает apt на машинах с
          установленной системой: в образе прописан источник

              deb [trusted=yes] https://raw.githubusercontent.com/F11htq/Glower/apt/ ./

          Файлы `Packages` и `Release` — опись склада, её пересобирает
          сборка при каждой метке версии. Править здесь руками нечего.
          ЧИТАЙ

          cd /tmp/apt
          git add -A
          git commit -m "Пакеты ${GITHUB_REF_NAME}" || echo "нечего класть"
          git push origin HEAD:apt
