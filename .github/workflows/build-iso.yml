# ==========================================================================
#  Сборка загрузочного образа GlowerOS силами GitHub
#
#  Запускается вручную (вкладка Actions → Build ISO → Run workflow) или по
#  метке версии вида v1.0. Готовый образ появляется в разделе Releases —
#  обычной ссылкой, без разрезания на части.
# ==========================================================================
name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Инструменты сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Chromium для образа
        run: |
          # В Ubuntu chromium идёт снапом, внутрь образа его не положить:
          # берём официальную сборку Chrome for Testing.
          VER=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["channels"]["Stable"]["version"])')
          curl -sL -o chrome.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$VER/linux64/chrome-linux64.zip"
          unzip -q chrome.zip
          echo "CHROME_DIR=$PWD/chrome-linux64" >> $GITHUB_ENV

      - name: Собрать образ
        run: sudo bash glower/linux/mkiso.sh --out glower.iso --chromium "$CHROME_DIR"

      - name: Контрольная сумма
        run: sha256sum glower.iso > glower.iso.sha256

      - name: Выложить как artifact
        uses: actions/upload-artifact@v4
        with:
          name: glower-iso
          path: |
            glower.iso
            glower.iso.sha256
          retention-days: 14

      - name: Выложить в релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glower.iso
            glower.iso.sha256
